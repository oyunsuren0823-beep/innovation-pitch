            { id: 'p17', category: CAT_OPERATIONS, teamInfo: 'Team Munkhsaikhan', projectName: 'SCADA - Хяналт, мэдээллийн Agents', description: 'Тоног төхөөрөмжүүдээс ирж буй бодит хугацааны өгөгдөл (SCADA event) болон түүхэн дата санг үүсгэж, уг мэдээлэл дээр үндэслэн:\n\nТогтмол мэдэгдэл (Alert): Тоног төхөөрөмжийн хэвийн ажиллагаа алдагдах, кабелийн гэмтэл гарах зэрэг онцгой SCADA event үүсэх үед холбогдох инженерүүд болон удирдлагуудад яаралтай мэдээлэл, дохио илгээх.\nУхаалаг Анализ: SCADA-ийн өгөгдөлд дүн шинжилгээ хийж, гэмтлийг эрт үе шатанд нь илрүүлэх, сүлжээний нөөцийн бэлэн байдлыг тасралтгүй хянах, тоноглолын элэгдэл, насжилтыг тооцоолох.\nТуршлагад суурилсан зөвлөмж: Өмнө нь гарч байсан гэмтлийн түүх, насжилтын тооцоололд үндэслэн тоноглолыг хэзээ солих, ямар төрлийн урьдчилан сэргийлэх засвар хийх талаар инженерийн түвшний оновчтой зөвлөмж гаргах.\nБичиг баримтын автоматжуулалт: Гэмтлийн анхан шатны бүртгэл, шалтгааны анализ (RCA) тайлан болон тоноглолын ашиглалтын паспортын шинэчлэлтийг системд автоматаар боловсруулах.', votes: 2, voters: [] },
            { id: 'p18', category: CAT_OPERATIONS, teamInfo: 'Team Munkhsaikhan', projectName: 'Data Manager (Quality Check Agent)', description: 'Байгууллагын дотоод системүүд болон SCADA системээс орж ирж буй өгөгдлүүдийн нэгдсэн урсгалын баазыг хянаж, уг систем дээр үндэслэн:\n\nТогтмол мэдэгдэл (Alert): Өгөгдлийн урсгал тасалдах, өгөгдөл алдагдах эсвэл чанарын шаардлага хангахгүй (алдаатай, дутуу) их хэмжээний дата системд бүртгэгдэх үед мэдээллийн технологийн багт анхааруулга илгээх.\nУхаалаг Хяналт (Quality check): Системүүдээс орж ирж буй өгөгдлийн чанарыг (Data quality) тогтмол шалгаж, дутуу болон стандартын бус датаг илрүүлэн, өгөгдөл хоорондын уялдааг хангаж урсгалыг зохицуулах.\nТуршлагад суурилсан зөвлөмж: Өгөгдөлд байнга гардаг алдааны хэв маяг, давтамжийг шинжилж, датаг анх бүртгэх үйл явцыг сайжруулах, алдааг бууруулах технологийн болон архитектурын зөвлөмж өгөх.\nҮйл явцын автоматжуулалт: Алдаатай эсвэл дутуу датаг автоматаар цэвэрлэх (Data cleansing), стандартын дагуу форматлах болон өгөгдлийн чанарын өдөр тутмын хяналтын тайланг (draft) автоматаар үүсгэх.', votes: 1, voters: [] }
        ];

        const PitchApp = () => {
            const [view, setView] = useState('form'); 
            const [currentSlide, setCurrentSlide] = useState(0);
            const [user, setUser] = useState(null);
            
            const [toastMsg, setToastMsg] = useState('');
            const [isSaving, setIsSaving] = useState(false);
            const [selectedTab, setSelectedTab] = useState('All'); 

            const initialIdea = {
                members: '', projectName: '', targetUser: '', category: CAT_MANAGEMENT, problem: '',
                solutionStep1: '', solutionStep2: '', solutionStep3: '', solutionStep4: '',
                businessValueLevel: 'High', businessValueDesc: '', dataReq: '', implSteps: '', implTime: ''
            };

            const [ideas, setIdeas] = useState([{ ...initialIdea }]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const activeIdea = ideas[currentIndex];

            const [votingIdeas, setVotingIdeas] = useState(PREDEFINED_IDEAS);
            const [showAddModal, setShowAddModal] = useState(false);
            const [newPrevIdea, setNewPrevIdea] = useState({ teamInfo: '', projectName: '', description: '' });
            
            const [selectedIdeaDetail, setSelectedIdeaDetail] = useState(null);

            // DB Auth - Local storage UUID approach for workshop convenience
            useEffect(() => {
                let localUserId = localStorage.getItem('voter_uid');
                if (!localUserId) {
                    localUserId = 'user_' + Math.random().toString(36).substr(2, 9);
                    localStorage.setItem('voter_uid', localUserId);
                }
                setUser({ uid: localUserId });
            }, []);

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 3000);
            };

            // Fetch Data from Supabase
            const fetchVotingData = async () => {
                if (!supabase) return;
                
                try {
                    const { data: dbIdeas, error } = await supabase.from('pitch_voting').select('*');
                    if (error) throw error;

                    const dbIdeaMap = {};
                    if (dbIdeas) {
                        dbIdeas.forEach(idea => dbIdeaMap[idea.id] = idea);
                    }

                    let combined = PREDEFINED_IDEAS.map(pIdea => {
                        return dbIdeaMap[pIdea.id] ? dbIdeaMap[pIdea.id] : pIdea;
                    });

                    if (dbIdeas) {
                        dbIdeas.forEach(idea => {
                            if (!PREDEFINED_IDEAS.find(p => p.id === idea.id)) {
                                combined.push(idea);
                            }
                        });
                    }

                    combined.sort((a, b) => (b.votes || 0) - (a.votes || 0));
                    setVotingIdeas(combined);
                    
                    if (selectedIdeaDetail) {
                        const updatedDetail = combined.find(i => i.id === selectedIdeaDetail.id);
                        if (updatedDetail) setSelectedIdeaDetail(updatedDetail);
                    }
                } catch (err) {
                    console.error("Fetch error:", err);
                }
            };

            useEffect(() => {
                if (!supabase || !user) return;
                
                fetchVotingData();

                // Setup realtime subscription
                const subscription = supabase.channel('public:pitch_voting')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'pitch_voting' }, payload => {
                        fetchVotingData();
                    })
                    .subscribe();

                return () => {
                    supabase.removeChannel(subscription);
                };
            }, [supabase, user, selectedIdeaDetail]);

                if (!supabase || !user) return showToast("Баазтай холбогдоогүй байна");
                
                const hasVoted = idea.voters && idea.voters.includes(user.uid);
                
                try {
                    let newVoters = idea.voters || [];
                    let newVotes = idea.votes || 0;

                    if (hasVoted) {
                        newVoters = newVoters.filter(uid => uid !== user.uid);
                        newVotes = Math.max(0, newVotes - 1);
                    } else {
                        newVoters = [...newVoters, user.uid];
                        newVotes = newVotes + 1;
                    }

                    const { error } = await supabase.from('pitch_voting').upsert({
                        id: idea.id,
                        teamInfo: idea.teamInfo || '',
                        projectName: idea.projectName || '',
                        description: idea.description || '',
                        category: idea.category || CAT_MANAGEMENT,
                        isNewWorkshopIdea: idea.isNewWorkshopIdea || false,
                        votes: newVotes,
                        voters: newVoters
                    });

                    if (error) throw error;
                    
                    // Local fallback update for instant feedback
                    fetchVotingData();
                } catch (error) {
                    console.error("Vote error:", error);
                    showToast("Санал өгөхөд алдаа гарлаа");
                }
            };

                const { name, value } = e.target;
                const updatedIdeas = [...ideas];
                updatedIdeas[currentIndex] = { ...updatedIdeas[currentIndex], [name]: value };
                setIdeas(updatedIdeas);
            };

            const addNewIdea = () => {
                setIdeas([...ideas, { ...initialIdea }]);
                setCurrentIndex(ideas.length);
            };

            const removeIdea = (index, e) => {
                e.stopPropagation();
                if (ideas.length === 1) return;
                const newIdeas = ideas.filter((_, i) => i !== index);
                setIdeas(newIdeas);
                setCurrentIndex(Math.min(currentIndex, newIdeas.length - 1));
            };

                }

                setIsSaving(true);
                try {
                    for (let i = 0; i < ideas.length; i++) {
                        const idea = ideas[i];
                        if (!idea.projectName) continue;
                        
                        const uniqueId = `${user.uid}_idea_${i}`; 
                        
                        const steps = [idea.solutionStep1, idea.solutionStep2, idea.solutionStep3, idea.solutionStep4]
                                      .filter(s => s).map((s, idx) => `• ${s}`).join('\n');

                        const generatedDesc = `Асуудал:\n${idea.problem || 'Тодорхойгүй'}\n\nШийдэл:\n${steps || 'Тодорхойгүй'}\n\nҮнэ цэн (${idea.businessValueLevel}):\n${idea.businessValueDesc || 'Тодорхойгүй'}\n\nӨгөгдөл:\n${idea.dataReq || 'Тодорхойгүй'}\n\nХэрэгжүүлэлт (MVP: ${idea.implTime || 'Тодорхойгүй'}):\n${idea.implSteps || 'Тодорхойгүй'}`;

                        const { error } = await supabase.from('pitch_voting').upsert({
                            id: uniqueId,
                            teamInfo: idea.members,
                            projectName: idea.projectName,
                            description: generatedDesc,
                            category: idea.category || CAT_MANAGEMENT,
                            isNewWorkshopIdea: true, 
                            createdAt: new Date().toISOString()

                    const newId = 'user_added_' + Math.random().toString(36).substr(2, 9);

                        id: newId,
                        ...newPrevIdea,
                        category: CAT_MANAGEMENT,
                        votes: 0,

                            <textarea name="problem" value={activeIdea.problem} onChange={handleChange} rows="3" className="w-full p-3 bg-slate-900/50 border border-slate-700 rounded-lg text-slate-200 focus:border-cyan-500 outline-none resize-none text-sm transition-colors placeholder-slate-600" placeholder="Одоогийн нөхцөл байдалд ямар асуудал тулгарч байна вэ?"></textarea>
                        </div>
                        <div className="bg-slate-800/50 p-5 md:p-6 rounded-2xl border border-slate-700/80 shadow-sm">
                            <h2 className="text-lg font-semibold text-slate-100 mb-4 flex items-center">2. Шийдэл</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {[1,2,3,4].map(num => (
                                    <div key={num} className="space-y-1.5">
                                        <label className="text-xs font-medium text-cyan-400/80">Алхам {num}</label>
                                        <input type="text" name={`solutionStep${num}`} value={activeIdea[`solutionStep${num}`]} onChange={handleChange} className="w-full p-2.5 bg-slate-900/50 border border-slate-700 rounded-lg text-slate-200 focus:border-cyan-500 outline-none text-sm transition-colors placeholder-slate-600" placeholder={`Шийдлийн алхам ${num}...`} />
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="bg-slate-800/50 p-5 md:p-6 rounded-2xl border border-slate-700/80 shadow-sm">
                            <h2 className="text-lg font-semibold text-slate-100 mb-4 flex items-center">3. Үнэ цэн</h2>
                            <div className="flex flex-col md:flex-row gap-4">
                                <select name="businessValueLevel" value={activeIdea.businessValueLevel} onChange={handleChange} className="md:w-1/4 p-2.5 bg-slate-900/50 border border-slate-700 rounded-lg text-slate-200 outline-none text-sm focus:border-cyan-500 transition-colors">
                                    <option value="High">Өндөр (High)</option>
                                    <option value="Medium">Дунд (Medium)</option>
                                    <option value="Low">Бага (Low)</option>
                                </select>
                                <textarea name="businessValueDesc" value={activeIdea.businessValueDesc} onChange={handleChange} rows="2" className="flex-grow p-3 bg-slate-900/50 border border-slate-700 rounded-lg text-slate-200 outline-none resize-none text-sm focus:border-cyan-500 transition-colors placeholder-slate-600" placeholder="Байгууллагад ямар үнэ цэн авчрах вэ?"></textarea>
                            </div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div className="bg-slate-800/50 p-5 md:p-6 rounded-2xl border border-slate-700/80 shadow-sm">
                                <h2 className="text-lg font-semibold text-slate-100 mb-4 flex items-center">4. Өгөгдөл</h2>
                                <textarea name="dataReq" value={activeIdea.dataReq} onChange={handleChange} rows="3" className="w-full p-3 bg-slate-900/50 border border-slate-700 rounded-lg text-slate-200 outline-none text-sm focus:border-cyan-500 transition-colors resize-none placeholder-slate-600" placeholder="Ямар систем, дата ашиглах вэ?"></textarea>
                            </div>
                            <div className="bg-slate-800/50 p-5 md:p-6 rounded-2xl border border-slate-700/80 shadow-sm flex flex-col">
                                <h2 className="text-lg font-semibold text-slate-100 mb-4 flex items-center">5. Хэрэгжүүлэлт</h2>
                                <textarea name="implSteps" value={activeIdea.implSteps} onChange={handleChange} rows="2" className="w-full p-3 bg-slate-900/50 border border-slate-700 rounded-lg text-slate-200 outline-none mb-3 flex-grow text-sm focus:border-cyan-500 transition-colors resize-none placeholder-slate-600" placeholder="Эхний алхмууд..."></textarea>
                                <div className="bg-slate-900/60 p-3 rounded-lg border border-slate-700/50 flex justify-between items-center">
                                    <span className="text-cyan-400/90 text-sm font-medium">MVP Хугацаа:</span>
                                    <input type="text" name="implTime" value={activeIdea.implTime} onChange={handleChange} className="bg-transparent border-b border-slate-600 text-right outline-none w-1/2 text-slate-200 text-sm focus:border-cyan-400 transition-colors" placeholder="Ж: 1 сар" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );

            // -------------------- СЛАЙДЫН ХЭСЭГ --------------------
            const PresentationView = () => {
                const Slide0 = () => (
                    <div className="flex flex-col items-center justify-center h-full text-center px-10 relative">
                        <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-indigo-900/20 via-slate-900 to-slate-900"></div>
                        <h1 className="text-7xl font-black text-transparent bg-clip-text bg-gradient-to-br from-cyan-300 via-indigo-400 to-purple-500 mb-8 relative z-10">{activeIdea.projectName || 'AI in Enterprise'}</h1>
                        <p className="text-3xl text-slate-400 mb-12 relative z-10">Хэрэглэгч: <span className="text-cyan-400">{activeIdea.targetUser || '...'}</span></p>
                        <div className="bg-slate-800/80 px-10 py-5 rounded-full border border-slate-700 relative z-10 flex flex-col items-center">
                            <span className="text-sm text-slate-500 uppercase tracking-widest mb-1">Илтгэгч / Баг</span>
                            <span className="text-2xl text-slate-200 font-bold">{activeIdea.members || '...'}</span>
                        </div>
                    </div>
                );
                const Slide1 = () => (
                    <div className="flex flex-col h-full px-16 py-16">
                        <h2 className="text-5xl font-black text-white mb-16 flex items-center"><span className="bg-slate-700 text-white w-16 h-16 rounded-2xl flex items-center justify-center mr-6 border border-slate-500">1</span> АСУУДАЛ</h2>
                        <div className="text-4xl text-slate-200 bg-slate-800/40 p-12 rounded-[2.5rem] border border-slate-600/50 flex-grow whitespace-pre-wrap">{activeIdea.problem}</div>
                    </div>
                );
                const Slide2 = () => (
                    <div className="flex flex-col h-full px-16 py-16">
                        <h2 className="text-5xl font-black text-white mb-12 flex items-center"><span className="bg-cyan-600 text-white w-16 h-16 rounded-2xl flex items-center justify-center mr-6 border border-cyan-400">2</span> ШИЙДЭЛ</h2>
                        <div className="grid grid-cols-2 gap-8 flex-grow">
                            {[1,2,3,4].map(n => (
                                <div key={n} className="bg-slate-800/60 p-10 rounded-[2rem] border border-slate-700 relative overflow-hidden">
                                    <div className="absolute -top-6 -right-6 text-8xl font-black text-slate-700/30">0{n}</div>
                                    <p className="text-3xl text-slate-200 relative z-10 mt-4">{activeIdea[`solutionStep${n}`]}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                );
                const Slide3 = () => (
                    <div className="flex flex-col h-full px-16 py-16 items-center justify-center space-y-16">
                        <h2 className="text-5xl font-black text-white absolute top-16 left-16 flex items-center"><span className="bg-emerald-600 text-white w-16 h-16 rounded-2xl flex items-center justify-center mr-6 border border-emerald-400">3</span> ҮНЭ ЦЭН</h2>
                        <div className="text-7xl font-black px-24 py-10 rounded-full border border-emerald-500/50 bg-emerald-900/20 text-emerald-400 shadow-[0_0_50px_rgba(16,185,129,0.3)]">{activeIdea.businessValueLevel} VALUE</div>
                        <div className="text-4xl text-slate-200 text-center max-w-5xl bg-slate-800/40 p-12 rounded-[3rem] border border-slate-700/50">{activeIdea.businessValueDesc}</div>
                    </div>
                );
                const Slide4 = () => (
                    <div className="flex flex-col h-full px-16 py-16">
                        <h2 className="text-5xl font-black text-white mb-12 flex items-center"><span className="bg-indigo-600 text-white w-16 h-16 rounded-2xl flex items-center justify-center mr-6 border border-indigo-400">4</span> ӨГӨГДӨЛ & ХЭРЭГЖҮҮЛЭЛТ</h2>
                        <div className="grid grid-cols-2 gap-12 flex-grow">
                            <div className="bg-slate-800/50 p-12 rounded-[3rem] border border-slate-700"><h3 className="text-3xl font-bold text-indigo-400 mb-8 tracking-widest">ӨГӨГДӨЛ</h3><p className="text-3xl text-slate-300 whitespace-pre-wrap">{activeIdea.dataReq}</p></div>
                            <div className="bg-slate-800/50 p-12 rounded-[3rem] border border-slate-700 flex flex-col"><h3 className="text-3xl font-bold text-cyan-400 mb-8 tracking-widest">ХЭРЭГЖҮҮЛЭЛТ</h3><p className="text-3xl text-slate-300 flex-grow whitespace-pre-wrap">{activeIdea.implSteps}</p><div className="bg-slate-900/80 p-8 rounded-3xl border border-cyan-500/30 flex justify-between items-center"><span className="text-slate-400 text-xl tracking-widest">MVP Хугацаа</span><span className="text-5xl font-black text-cyan-400">{activeIdea.implTime}</span></div></div>
                        </div>
                    </div>
                );

                const slides = [<Slide0/>, <Slide1/>, <Slide2/>, <Slide3/>, <Slide4/>];

                return (
                    <div className="fixed inset-0 bg-[#0a0f1c] z-50 flex flex-col p-4">
                        <button onClick={() => setView('form')} className="absolute top-6 left-6 z-[60] bg-slate-800/50 px-5 py-2.5 rounded-xl text-white text-sm font-medium border border-slate-600 hover:bg-slate-700 transition-colors">← БУЦАХ</button>
                        <div className="flex-grow bg-[#0f172a] rounded-[2rem] shadow-[0_0_100px_rgba(0,0,0,0.8)] relative overflow-hidden border border-slate-800">
                            {slides[currentSlide]}
                            <div className="absolute bottom-8 left-0 right-0 flex justify-center space-x-6 items-center">
                                <button onClick={() => setCurrentSlide(p => Math.max(0, p-1))} className="p-3 rounded-full bg-slate-800 text-cyan-400 border border-slate-700 hover:bg-slate-700 transition-colors">←</button>
                                <div className="flex space-x-3 px-5 py-2.5 rounded-full bg-slate-900 border border-slate-800">
                                    {slides.map((_, idx) => <div key={idx} className={`w-2.5 h-2.5 rounded-full transition-all ${idx === currentSlide ? 'bg-cyan-400 w-8' : 'bg-slate-600'}`}></div>)}
                                </div>
                                <button onClick={() => setCurrentSlide(p => Math.min(slides.length-1, p+1))} className="p-3 rounded-full bg-slate-800 text-cyan-400 border border-slate-700 hover:bg-slate-700 transition-colors">→</button>
                            </div>
                        </div>
                    </div>
                );
            };

            if (view === 'voting') return <VotingView />;
            return view === 'form' ? <FormView /> : <PresentationView />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PitchApp />);
    </script>
</body>
</html>
