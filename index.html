            { id: 'p2', category: CAT_MANAGEMENT, teamInfo: 'Team Tsogtbayar', projectName: 'Tender Research Agent', description: '[Meta-V:High|F:High|S:false]\nГадаад болон дотоодын тендерийн нээлттэй мэдээллийн санг байгууллагын профайлтай уялдуулан нэгтгэж, оролцох боломжийг үнэлэх систем.\n\n- Шинэ тендерийн мэдэгдэл\n- Тендерийн шаардлагад дүн шинжилгээ хийх\n- Тендерийн саналын эхний нооргийг боловсруулах', votes: 12, voters: [] },
            { id: 'p3', category: CAT_MANAGEMENT, teamInfo: 'Team Lkhagvaragchaa', projectName: 'Lesson Learned Bot', description: '[Meta-V:Medium|F:High|S:false]\nӨмнөх төслүүдийн туршлага, алдаа оноог цуглуулан ангилж, шинэ төсөл эхлүүлэх үед зөвлөмж өгөх туслах.\n\n- Chimege Voice-to-text ашиглан аудиог текст болгох\n- Эрсдэлийн сануулга илгээх\n- Өмнөх өгөгдөл дээр үндэслэн төлөвлөгөө сайжруулах', votes: 11, voters: [] },
            { id: 'p4', category: CAT_MANAGEMENT, teamInfo: 'Team Lkhagvaragchaa', projectName: 'PMBOK Multi agents', description: '[Meta-V:High|F:Low|S:false]\nPMBOK аргачлалд суурилсан төлөвлөлт, гүйцэтгэл, эрсдэлийн хяналтыг нэгтгэсэн олон агент бүхий систем.\n\n- Нөөц, хугацааны оновчтой хуваарилалт\n- Гүйцэтгэлийн аудит хийх\n- Хазайлтыг илрүүлж сайжруулах санал гаргах', votes: 10, voters: [] },
            { id: 'p5', category: CAT_MANAGEMENT, teamInfo: 'Team Tsogtbayar', projectName: 'Мэдлэг, туршлагын сан', description: '[Meta-V:High|F:High|S:false]\nЭкспертүүдийн мэдлэг, туршлагыг дижитал хөрвүүлж, ажилтнуудын асуултад хариулах дотоод ухаалаг чатбот.\n\n- Know-how мэдээллийг ангилах\n- Сургалт хөгжлийн зөвлөмж өгөх\n- Чиглүүлэх (onboarding) материалыг санал болгох', votes: 9, voters: [] },
            { id: 'p6', category: CAT_MANAGEMENT, teamInfo: 'Team Tsogtbayar', projectName: 'Гэрээний Agent', description: '[Meta-V:High|F:Medium|S:false]\nГэрээний төсөлд автоматаар дүн шинжилгээ хийж, хууль болон стандартад нийцэж буй эсэхийг хянаж эрсдэлийг анхааруулах систем.\n\n- Гэрээний автомат хяналт\n- Эрсдэлтэй заалтыг илрүүлэх\n- Засаж сайжруулсан хувилбарыг санал болгох', votes: 8, voters: [] },
            { id: 'p7', category: CAT_MANAGEMENT, teamInfo: 'Team Tsogtbayar', projectName: 'IMS Agent', description: '[Meta-V:Medium|F:High|S:false]\nБайгууллагын нэгдсэн удирдлагын систем (ISO)-ийн хүрээнд аудит хийх, үл тохирлыг илрүүлж зөвлөмж өгөх систем.\n\n- Аудитын хуваарийн мэдэгдэл\n- Стандартын шаардлагаар чиглүүлэх\n- Залруулах арга хэмжээний төлөвлөгөө боловсруулах', votes: 8, voters: [] },
            { id: 'p8', category: CAT_MANAGEMENT, teamInfo: 'Team Tsogtbayar', projectName: 'MoM agent', description: '[Meta-V:Medium|F:High|S:false]\nХурлын яриаг бодит цагт сонсож тэмдэглэл хөтлөн, гарсан шийдвэрүүдээс Action plan автоматаар үүсгэх систем.\n\n- Яриаг хураангуйлан тэмдэглэх\n- Ажлын биелэлтийн хугацааг сануулах\n- Төслийн системд ажлуудыг бүртгэх', votes: 7, voters: [] },
            { id: 'p9', category: CAT_MANAGEMENT, teamInfo: 'Team Tsogtbayar', projectName: 'Зураг төслийн Agent', description: '[Meta-V:High|F:Low|S:false]\nИнженерийн зураг төслийн норм дүрэм, стандартын дагуу хиймэл оюунд суурилсан дизайны хувилбаруудыг санал болгох систем.\n\n- Норм дүрмийн зөрчлийн мэдэгдэл\n- Generative design хувилбарууд гаргах\n- Материалын орцын жагсаалт (BoQ) боловсруулах', votes: 6, voters: [] },
            { id: 'p10', category: CAT_OPERATIONS, teamInfo: 'Team Khurtsdulguun', projectName: 'DCD (Тархмал сүлжээг хянах)', description: '[Meta-V:High|F:Medium|S:false]\nТархмал сүлжээний бүрэлдэхүүн хэсгүүдийн өгөгдөлд анализ хийж, эвдрэл гэмтлийг урьдчилан таамаглах систем.\n\n- Хүчин чадал хэтрэх эрсдэлийн мэдэгдэл\n- Сүлжээний найдвартай байдлыг хянах\n- Засварын зардлыг бууруулах санал гаргах', votes: 5, voters: [] },
            { id: 'p11', category: CAT_OPERATIONS, teamInfo: 'Team Ganbat', projectName: 'Ухаалаг тоолуур + AI', description: '[Meta-V:High|F:High|S:false]\nУхаалаг тоолууруудаас ирж буй өгөгдөлд анализ хийж, техникийн болон арилжааны алдагдлыг илрүүлэх систем.\n\n- Хөндлөнгийн оролцооны анхааруулга\n- Алдагдлын голомтыг үнэн зөв илрүүлэх\n- Хяналт шалгалтыг оновчлох зөвлөм гаргах', votes: 5, voters: [] },
            { id: 'p12', category: CAT_OPERATIONS, teamInfo: 'Team Ganbat', projectName: 'Хэрэглэгчийн зан төлөвийн AI', description: '[Meta-V:High|F:Medium|S:false]\nХэрэглэгчдийн хэрэглээний зан төлөвт урьдчилан таамаглах анализ хийж, оновчтой тарифын багцыг санал болгох систем.\n\n- Хэрэглээний хэв маягийн өөрчлөлтийн мэдэгдэл\n- Ирээдүйн ачааллын муруй гаргах\n- Хэрэглээг оновчлох зөвлөмж өгөх', votes: 4, voters: [] },
            { id: 'p13', category: CAT_OPERATIONS, teamInfo: 'Team Ganbat', projectName: 'Цаг агаарын Forecast Agent', description: '[Meta-V:Medium|F:High|S:false]\nЦаг агаарын урьдчилсан мэдээнд үндэслэн үүсэж болзошгүй гэмтэл, саатлын байршлыг таамаглах систем.\n\n- Байгалийн гамшгийн үеийн сануулга\n- Хүний нөөц, техникийг оновчтой хуваарилах\n- Гэмтлийн байршлыг урьдчилан таамаглах', votes: 4, voters: [] },
            { id: 'p14', category: CAT_OPERATIONS, teamInfo: 'Team Gantulga', projectName: 'Work Order Үүсгэдэг Agent', description: '[Meta-V:High|F:High|S:false]\nМэдрэгчүүдийн датанд анализ хийж болзошгүй эвдрэлийг илрүүлэн, автоматаар засварын Work Request үүсгэх систем.\n\n- Эвдрэлийн таамаглал, зардлын тооцоо\n- Сэлбэг хэрэгслийн зөвлөм гаргах\n- Худалдан авалтын хүсэлт (PR) автоматаар үүсгэх', votes: 3, voters: [] },
            { id: 'p15', category: CAT_OPERATIONS, teamInfo: 'Team Gantulga', projectName: 'Тайлан хийдэг Agent', description: '[Meta-V:Medium|F:High|S:false]\nЗасвар үйлчилгээний болон зардлын чиг хандлагад анализ хийж, өдөр тутмын тайлангуудыг автоматаар бэлтгэх систем.\n\n- Зардал хэтрэлтийн анхааруулга\n- Тоноглолыг шинэчлэх эдийн засгийн үнэлгээ\n- Тайлангуудыг хүний оролцоогүй үүсгэх', votes: 3, voters: [] },
            { id: 'p16', category: CAT_OPERATIONS, teamInfo: 'Team Gantulga', projectName: 'Засварын зөвлөмж Bot', description: '[Meta-V:High|F:Medium|S:false]\nИнженерүүдэд газар дээр нь засварын зааварчилгаа, аюулгүй ажиллагааны зөвлөмжийг чат хэлбэрээр өгөх туслах.\n\n- Аюулгүй ажиллагааны эрсдэлийн сануулга\n- Засварын зааварчилгааг шуурхай хариулах\n- Гүйцэтгэлийн тайланг автоматаар үүсгэх', votes: 2, voters: [] },
            { id: 'p17', category: CAT_OPERATIONS, teamInfo: 'Team Munkhsaikhan', projectName: 'SCADA - Хяналтын Agents', description: '[Meta-V:High|F:Medium|S:false]\nSCADA системээс ирж бодит хугацааны өгөгдөлд дүн шинжилгээ хийж, тоноглолын элэгдэл, насжилтыг тооцоолох систем.\n\n- Онцгой SCADA event мэдэгдэл\n- Кабелийн гэмтлийг эрт илрүүлэх\n- Тоноглолыг солих хугацааг тооцоолох', votes: 2, voters: [] },
            { id: 'p18', category: CAT_OPERATIONS, teamInfo: 'Team Munkhsaikhan', projectName: 'Data Quality Manager', description: '[Meta-V:High|F:High|S:false]\nСистемүүдээс орж ирж буй өгөгдлийн чанарыг тогтмол шалгаж, дутуу болон стандартын бус датаг цэвэрлэх систем.\n\n- Өгөгдлийн урсгал тасалдлын мэдэгдэл\n- Алдаатай датаг автоматаар цэвэрлэх\n- Мэдээллийн чанарын хяналтын тайлан үүсгэх', votes: 1, voters: [] }
        ];

        // Текстийг задалж Value, Feasibility, Shortlisted болон тайлбарыг ялгах функц
        const extractMeta = (descString) => {
            let v = 'Medium';
            let f = 'Medium';
            let s = false; // Shortlisted эсэх
            let text = descString || '';
            let feasDesc = '';
            
            if (text.startsWith('[Meta-')) {
                const endIdx = text.indexOf(']');
                if (endIdx > -1) {
                    const metaStr = text.substring(6, endIdx); 
                    const parts = metaStr.split('|');
                    parts.forEach(p => {
                        if(p.startsWith('V:')) v = p.replace('V:', '');
                        if(p.startsWith('F:')) f = p.replace('F:', '');
                        if(p.startsWith('S:')) s = p.replace('S:', '') === 'true';
                    });
                    text = text.substring(endIdx + 1).trim();
                }
            }

            const feasDivider = '---FEAS_DESC---';
            const feasIdx = text.indexOf(feasDivider);
            if (feasIdx > -1) {
                feasDesc = text.substring(feasIdx + feasDivider.length).trim();
                text = text.substring(0, feasIdx).trim();
            }

            return { valueLevel: v, feasLevel: f, isShortlisted: s, cleanDesc: text, feasDesc: feasDesc };
        };

        const getFeasScore = (level) => level === 'High' ? 3 : (level === 'Medium' ? 2 : 1);

        const App = () => {
            const [view, setView] = useState('form'); 
            const [currentSlide, setCurrentSlide] = useState(0);
            const [user, setUser] = useState(null);
            const [toastMsg, setToastMsg] = useState('');
            const [isSaving, setIsSaving] = useState(false);
            const [selectedTab, setSelectedTab] = useState('All'); 
            const [votingIdeas, setVotingIdeas] = useState(PREDEFINED_IDEAS);
            
            // Modal-ийн state
            const [selectedIdeaId, setSelectedIdeaId] = useState(null);
            const [modalFeasLevel, setModalFeasLevel] = useState('Medium');
            const [modalFeasDesc, setModalFeasDesc] = useState('');

            const selectedIdeaDetail = useMemo(() => {
                return votingIdeas.find(i => i.id === selectedIdeaId) || null;
            }, [votingIdeas, selectedIdeaId]);

            const initialIdea = {
                members: '', projectName: '', targetUser: '', category: CAT_MANAGEMENT, problem: '',
                solutionGeneral: '', solutionStep1: '', solutionStep2: '', solutionStep3: '', 
                businessValueLevel: 'High', businessValueDesc: '', feasibilityLevel: 'Medium', feasibilityDesc: ''
            };

            const [ideas, setIdeas] = useState([{ ...initialIdea }]);
            const [currentIndex, setCurrentIndex] = useState(0);
            
            const client = useMemo(() => {
                if (typeof window.supabase !== 'undefined') {
                    return window.supabase.createClient(supabaseUrl, supabaseKey);
                }
                return null;
            }, []);

            const activeIdea = useMemo(() => ideas[currentIndex] || initialIdea, [ideas, currentIndex]);

            useEffect(() => {
                let localUserId = localStorage.getItem('pitch_voter_id');
                if (!localUserId) {
                    localUserId = 'user_' + Math.random().toString(36).substr(2, 9);
                    localStorage.setItem('pitch_voter_id', localUserId);
                }
                setUser({ uid: localUserId });
            }, []);

            const sortIdeas = (ideasArray) => {
                return [...ideasArray].sort((a, b) => {
                    const votesA = a.votes || 0;
                    const votesB = b.votes || 0;
                    if (votesB !== votesA) return votesB - votesA;
                    
                    const feasA = getFeasScore(extractMeta(a.description).feasLevel);
                    const feasB = getFeasScore(extractMeta(b.description).feasLevel);
                    return feasB - feasA;
                });
            };

            const fetchVotingData = async () => {
                if (!client) return;
                try {
                    const { data: dbIdeas, error } = await client.from('pitch_voting').select('*');
                    if (error) throw error;

                    const dbIdeaMap = {};
                    if (dbIdeas) {
                        dbIdeas.forEach(idea => {
                            dbIdeaMap[idea.id] = {
                                ...idea,
                                projectName: idea.projectname || idea.project_name || idea.projectName,
                                teamInfo: idea.teaminfo || idea.team_info || idea.teamInfo
                            };
                        });
                    }

                    let combined = PREDEFINED_IDEAS.map(pIdea => {
                        return dbIdeaMap[pIdea.id] ? dbIdeaMap[pIdea.id] : pIdea;
                    });

                    if (dbIdeas) {
                        dbIdeas.forEach(idea => {
                            if (!PREDEFINED_IDEAS.find(p => p.id === idea.id)) {
                                combined.push(dbIdeaMap[idea.id]);
                            }
                        });
                    }

                    setVotingIdeas(sortIdeas(combined));
                } catch (e) {
                    console.error("Fetch error:", e);
                }
            };

            useEffect(() => {
                if (!client) {
                    setVotingIdeas(sortIdeas(PREDEFINED_IDEAS));
                    return;
                }
                fetchVotingData();
                const intervalId = setInterval(() => {
                    fetchVotingData();
                }, 5000);
                return () => clearInterval(intervalId);
            }, [client]);

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 3000);
            };

            const downloadExcel = () => {
                const headers = ['Ангилал', 'Төслийн нэр', 'Баг', 'Нийт Санал', 'Бизнесийн үнэ цэн', 'Технологийн боломж (Feasibility)', 'Shortlisted', 'Асуудал & Шийдэл', 'Feasibility Тайлбар'];
                
                const escapeCSV = (str) => {
                    if (str === null || str === undefined) return '""';
                    return `"${str.toString().replace(/"/g, '""')}"`;
                };

                const csvRows = [headers.join(',')];
                
                votingIdeas.forEach(idea => {
                    const meta = extractMeta(idea.description);
                    const row = [
                        escapeCSV(idea.category),
                        escapeCSV(idea.projectName),
                        escapeCSV(idea.teamInfo),
                        idea.votes || 0,
                        escapeCSV(meta.valueLevel),
                        escapeCSV(meta.feasLevel),
                        escapeCSV(meta.isShortlisted ? 'Тийм' : 'Үгүй'),
                        escapeCSV(meta.cleanDesc),
                        escapeCSV(meta.feasDesc)
                    ];
                    csvRows.push(row.join(','));
                });

                const csvString = '\uFEFF' + csvRows.join('\n'); 
                const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', 'Idea_Workshop_Export.csv');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const toggleVote = async (idea) => {
                const voterUid = user?.uid || 'local_user';
                const hasVoted = idea.voters && idea.voters.includes(voterUid);
                let newVoters = idea.voters || [];
                let newVotes = idea.votes || 0;

                if (hasVoted) {
                    newVoters = newVoters.filter(uid => uid !== voterUid);
                    newVotes = Math.max(0, newVotes - 1);
                } else {
                    newVoters = [...newVoters, voterUid];
                    newVotes = newVotes + 1;
                }

                setVotingIdeas(prev => sortIdeas(prev.map(i => i.id === idea.id ? { ...i, votes: newVotes, voters: newVoters } : i)));

                if (client) {
                    const { error } = await client.from('pitch_voting').upsert({
                        id: idea.id,
                        votes: newVotes,
                        voters: newVoters,
                        projectname: idea.projectName, 
                        teaminfo: idea.teamInfo,       
                        description: idea.description,
                        category: idea.category
                    });
                    
                    if (error) {
                        showToast("Санал өгөхөд алдаа гарлаа (DB)");

                    const { error } = await client.from('pitch_voting').upsert({
                        id: idea.id,
                        votes: idea.votes || 0,
                        voters: idea.voters || [],
                        projectname: idea.projectName,
                        teaminfo: idea.teamInfo,
                        category: idea.category,
                        description: newDesc

                        showToast("Shortlist өөрчлөхөд алдаа гарлаа");

                        id: selectedIdeaDetail.id,
                        votes: selectedIdeaDetail.votes || 0,
                        voters: selectedIdeaDetail.voters || [],
                        projectname: selectedIdeaDetail.projectName, 
                        teaminfo: selectedIdeaDetail.teamInfo,

                        description: newDesc

                                        <div className="space-y-1.5">
                                            <label className="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Алхам 1</label>
                                            <input type="text" name="solutionStep1" value={activeIdea.solutionStep1} onChange={handleChange} className="w-full p-3.5 bg-slate-900/50 border border-slate-700 rounded-xl outline-none focus:border-cyan-500 text-sm text-white transition-colors" placeholder="..." />
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Алхам 2</label>
                                            <input type="text" name="solutionStep2" value={activeIdea.solutionStep2} onChange={handleChange} className="w-full p-3.5 bg-slate-900/50 border border-slate-700 rounded-xl outline-none focus:border-cyan-500 text-sm text-white transition-colors" placeholder="..." />
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Алхам 3</label>
                                            <input type="text" name="solutionStep3" value={activeIdea.solutionStep3} onChange={handleChange} className="w-full p-3.5 bg-slate-900/50 border border-slate-700 rounded-xl outline-none focus:border-cyan-500 text-sm text-white transition-colors" placeholder="..." />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Үнэлгээний 2 хэсэг */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 flex-grow">
                                <div className="bg-slate-800/50 p-6 md:p-8 rounded-2xl border border-slate-700 shadow-inner flex flex-col">
                                    <h3 className="text-lg font-bold text-emerald-400 mb-6 border-b border-slate-700 pb-3">3. Бизнесийн үнэ цэн</h3>
                                    <div className="space-y-4 flex flex-col flex-grow">
                                        <div className="space-y-1.5">
                                            <label className="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Үнэлгээ (Value)</label>
                                            <select name="businessValueLevel" value={activeIdea.businessValueLevel} onChange={handleChange} className="w-full p-3.5 bg-slate-900/50 border border-slate-700 rounded-xl outline-none focus:border-emerald-500 text-sm text-white transition-colors">
                                                <option value="High">Өндөр (Стратегийн/санхүүгийн том нөлөө)</option>
                                                <option value="Medium">Дунд (Үйл ажиллагааг хөнгөвчлөх, цаг хэмнэх)</option>
                                                <option value="Low">Бага (Тодорхой нэг жижиг хэсгийг сайжруулах)</option>
                                            </select>
                                        </div>
                                        <div className="space-y-1.5 flex-grow flex flex-col">
                                            <label className="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Тайлбар</label>
                                            <textarea name="businessValueDesc" value={activeIdea.businessValueDesc} onChange={handleChange} className="w-full p-4 bg-slate-900/50 border border-slate-700 rounded-xl outline-none focus:border-emerald-500 text-sm text-white resize-none flex-grow transition-colors" placeholder="Үр өгөөжийн тайлбар..."></textarea>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-slate-800/50 p-6 md:p-8 rounded-2xl border border-slate-700 shadow-inner flex flex-col">
                                    <h3 className="text-lg font-bold text-blue-400 mb-6 border-b border-slate-700 pb-3">4. Технологийн хэрэгжих боломж</h3>
                                    <div className="space-y-4 flex flex-col flex-grow">
                                        <div className="space-y-1.5">
                                            <label className="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Боломж (Feasibility)</label>
                                            <select name="feasibilityLevel" value={activeIdea.feasibilityLevel} onChange={handleChange} className="w-full p-3.5 bg-slate-900/50 border border-slate-700 rounded-xl outline-none focus:border-blue-500 text-sm text-white transition-colors">
                                                <option value="High">Өндөр (Бэлэн технологи, хялбар нэвтрүүлэх)</option>
                                                <option value="Medium">Дунд (Боломжтой ч нэмэлт хөгжүүлэлт шаардана)</option>
                                                <option value="Low">Бага (Нарийн судалгаа, их цаг/зардал орно)</option>
                                            </select>
                                        </div>
                                        <div className="space-y-1.5 flex-grow flex flex-col">
                                            <label className="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Тайлбар (Tech Team)</label>
                                            <textarea name="feasibilityDesc" value={activeIdea.feasibilityDesc} onChange={handleChange} className="w-full p-4 bg-slate-900/50 border border-slate-700 rounded-xl outline-none focus:border-blue-500 text-sm text-white resize-none flex-grow transition-colors" placeholder="Технологийн багийн дүгнэлт, саналууд..."></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                    
                    <div className="flex justify-center mt-10 pb-12">
                        <button onClick={() => {setCurrentSlide(0); setView('presentation');}} className="px-12 py-5 bg-slate-800 hover:bg-slate-700 rounded-2xl font-black text-sm transition-all border border-slate-600 shadow-2xl text-cyan-400 uppercase tracking-widest hover:-translate-y-1">
                            Start Presentation
                        </button>
                    </div>
                </div>
            );

            const renderPresentationView = () => {
                const Slide0 = () => (
                    <div className="flex flex-col items-center justify-center h-full text-center px-10">
                        <h1 className="text-6xl md:text-8xl font-black text-white mb-10 tracking-tighter uppercase leading-tight">{activeIdea.projectName || 'Төслийн нэр'}</h1>
                        <p className="text-2xl text-cyan-400 mb-16 font-semibold tracking-[0.2em] uppercase">Хэрэглэгч: {activeIdea.targetUser}</p>
                        <div className="bg-slate-800/80 px-10 py-5 rounded-full border border-slate-600 flex items-center gap-6 shadow-2xl backdrop-blur-md">
                            <span className="text-sm text-slate-400 uppercase font-bold tracking-[0.3em]">Баг</span>
                            <span className="text-3xl text-white font-black">{activeIdea.members || '...'}</span>
                        </div>
                    </div>
                );

                const Slide1 = () => (
                    <div className="flex flex-col h-full px-12 py-10 md:px-20 md:py-16">
                        <h2 className="text-4xl md:text-5xl font-black text-rose-400 mb-8 uppercase tracking-widest border-b-4 border-rose-500/30 pb-4 inline-block w-max">1. АСУУДАЛ</h2>
                        <div className="text-2xl md:text-3xl text-slate-200 font-medium leading-normal bg-slate-800/40 p-8 md:p-12 rounded-[2.5rem] border border-slate-700 flex-grow whitespace-pre-wrap shadow-inner overflow-y-auto custom-scrollbar">
                            {activeIdea.problem || '...'}
                        </div>
                    </div>
                );

                const Slide2 = () => (
                    <div className="flex flex-col h-full px-12 py-10 md:px-20 md:py-16">
                        <h2 className="text-4xl md:text-5xl font-black text-cyan-400 mb-8 uppercase tracking-widest border-b-4 border-cyan-500/30 pb-4 inline-block w-max">2. ШИЙДЭЛ</h2>
                        <div className="text-xl md:text-2xl text-slate-200 font-medium leading-relaxed bg-slate-800/40 p-6 md:p-8 rounded-[2rem] border border-slate-700 mb-8 whitespace-pre-wrap shadow-inner overflow-y-auto custom-scrollbar">
                            {activeIdea.solutionGeneral || 'Ерөнхий шийдэл...'}
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 flex-grow min-h-[40%]">
                            {[activeIdea.solutionStep1, activeIdea.solutionStep2, activeIdea.solutionStep3].map((step, idx) => (
                                <div key={idx} className="bg-slate-800/60 p-6 md:p-8 rounded-[2.5rem] border border-slate-600 relative shadow-2xl flex flex-col justify-center overflow-y-auto custom-scrollbar">
                                    <div className="text-5xl font-black text-slate-700/50 absolute top-4 right-6">0{idx+1}</div>
                                    <p className="text-lg md:text-xl text-slate-200 mt-8 relative z-10 font-bold leading-snug">{step || '...'}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                );

                const Slide3 = () => (
                    <div className="flex flex-col h-full px-12 py-10 md:px-20 md:py-16 items-center justify-center">
                        <h2 className="text-4xl md:text-5xl font-black text-white mb-10 uppercase tracking-widest text-center">3. Үнэлгээний матриц</h2>
                        
                        <div className="grid grid-cols-2 gap-8 md:gap-12 flex-grow w-full">
                            {/* Business Value */}
                            <div className="bg-slate-800/50 border border-slate-600 rounded-[3rem] p-8 md:p-12 flex flex-col items-center text-center shadow-2xl relative overflow-hidden">
                                <div className="absolute top-0 w-full h-2 bg-emerald-500"></div>
                                <h3 className="text-xl md:text-2xl font-bold text-slate-400 uppercase tracking-widest mb-6">Бизнесийн үнэ цэн</h3>
                                <div className="text-4xl md:text-5xl font-black px-8 py-4 rounded-full border border-emerald-500 bg-emerald-900/30 text-emerald-400 shadow-[0_0_40px_rgba(16,185,129,0.3)] uppercase mb-8 tracking-wider">
                                    {activeIdea.businessValueLevel}
                                </div>
                                <div className="text-xl md:text-2xl text-slate-300 font-medium leading-relaxed whitespace-pre-wrap overflow-y-auto custom-scrollbar h-full">
                                    {activeIdea.businessValueDesc || '...'}
                                </div>
                            </div>

                            {/* Feasibility */}
                            <div className="bg-slate-800/50 border border-slate-600 rounded-[3rem] p-8 md:p-12 flex flex-col items-center text-center shadow-2xl relative overflow-hidden">
                                <div className="absolute top-0 w-full h-2 bg-blue-500"></div>
                                <h3 className="text-xl md:text-2xl font-bold text-slate-400 uppercase tracking-widest mb-6">Хэрэгжих боломж</h3>
                                <div className="text-4xl md:text-5xl font-black px-8 py-4 rounded-full border border-blue-500 bg-blue-900/30 text-blue-400 shadow-[0_0_40px_rgba(59,130,246,0.3)] uppercase mb-8 tracking-wider">
                                    {activeIdea.feasibilityLevel}
                                </div>
                                <div className="text-xl md:text-2xl text-slate-300 font-medium leading-relaxed whitespace-pre-wrap overflow-y-auto custom-scrollbar h-full">
                                    {activeIdea.feasibilityDesc || '...'}
                                </div>
                            </div>
                        </div>
                    </div>
                );

                const presSlides = [<Slide0/>, <Slide1/>, <Slide2/>, <Slide3/>];

                return (
                    <div className="fixed inset-0 bg-[#0a0f1c] z-50 flex flex-col" style={{animation: 'fadeIn 0.4s ease-out'}}>
                        
                        <div className="flex-grow flex items-center justify-center relative overflow-hidden">
                            <div className="w-full h-full relative z-10 p-4 pb-24 md:p-8 md:pb-28">
                                <div className="w-full h-full bg-[#0f172a] rounded-[3rem] shadow-[0_0_100px_rgba(0,0,0,0.8)] border border-slate-700/50 overflow-hidden relative">
                                     {presSlides[currentSlide]}
                                </div>
                            </div>
                            
                            {/* Background Blur Elements */}
                            <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-cyan-900/20 blur-[150px] rounded-full pointer-events-none"></div>
                            <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-indigo-900/20 blur-[150px] rounded-full pointer-events-none"></div>
                        </div>

                        {/* Navigation Actions */}
                        <div className="absolute bottom-6 left-0 right-0 flex justify-between items-center px-8 md:px-16 z-20">
                            
                            <button onClick={(e) => {e.stopPropagation(); setView('form');}} className="bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-6 py-3 md:px-8 md:py-4 rounded-2xl font-bold border border-slate-600 transition-colors text-xs md:text-sm uppercase tracking-widest flex items-center gap-2 md:gap-3 shadow-xl">
                                <span className="text-lg md:text-xl">✕</span> Буцах
                            </button>

                            <div className="flex items-center gap-4 md:gap-8 bg-slate-900/80 p-2 md:p-3 rounded-full border border-slate-700 backdrop-blur-md shadow-2xl">
                                <button 
                                    onClick={(e) => { e.stopPropagation(); setCurrentSlide(p => Math.max(0, p - 1)); }}
                                    className={`w-10 h-10 md:w-14 md:h-14 rounded-full flex items-center justify-center bg-slate-800 text-cyan-400 font-bold border border-slate-600 hover:bg-slate-700 transition-all ${currentSlide === 0 ? 'opacity-30 pointer-events-none' : ''}`}
                                >
                                    <svg className="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M15 19l-7-7 7-7"></path></svg>
                                </button>
                                
                                <div className="flex space-x-2 md:space-x-4 px-2 md:px-4">
                                    {presSlides.map((_, idx) => (
                                        <div key={idx} className={`w-2 h-2 md:w-3 md:h-3 rounded-full transition-all duration-500 ${idx === currentSlide ? 'bg-cyan-400 w-8 md:w-12 shadow-[0_0_15px_rgba(34,211,238,0.6)]' : 'bg-slate-600'}`}></div>
                                    ))}
                                </div>

                                <button 
                                    onClick={(e) => { e.stopPropagation(); setCurrentSlide(p => Math.min(presSlides.length - 1, p + 1)); }}
                                    className={`w-10 h-10 md:w-14 md:h-14 rounded-full flex items-center justify-center bg-slate-800 text-cyan-400 font-bold border border-slate-600 hover:bg-slate-700 transition-all ${currentSlide === presSlides.length - 1 ? 'opacity-30 pointer-events-none' : ''}`}
                                >
                                    <svg className="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M9 5l7 7-7 7"></path></svg>
                                </button>
                            </div>
                            
                            <div className="w-[100px] md:w-[150px]"></div> {/* Layout Balance spacer */}
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-slate-900 relative">
                    {renderToast()}
                    {view === 'voting' ? renderVotingView() : (view === 'form' ? renderFormView() : renderPresentationView())}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
