            { id: 'p6', category: CAT_MANAGEMENT, teamInfo: 'Team Tsogtbayar', projectName: 'Гэрээний Agent', description: 'Гэрээний төсөлд автоматаар дүн шинжилгээ хийж, хууль болон стандартад нийцэж буй эсэхийг хянаж эрсдэлийг анхааруулах систем.\n\n- Гэрээний автомат хяналт\n- Эрсдэлтэй заалтыг илрүүлэх\n- Засаж сайжруулсан хувилбарыг санал болгох', votes: 8, voters: [] },
            { id: 'p7', category: CAT_MANAGEMENT, teamInfo: 'Team Tsogtbayar', projectName: 'IMS Agent', description: 'Байгууллагын нэгдсэн удирдлагын систем (ISO)-ийн хүрээнд аудит хийх, үл тохирлыг илрүүлж зөвлөмж өгөх систем.\n\n- Аудитын хуваарийн мэдэгдэл\n- Стандартын шаардлагаар чиглүүлэх\n- Залруулах арга хэмжээний төлөвлөгөө боловсруулах', votes: 8, voters: [] },
            { id: 'p8', category: CAT_MANAGEMENT, teamInfo: 'Team Tsogtbayar', projectName: 'MoM agent', description: 'Хурлын яриаг бодит цагт сонсож тэмдэглэл хөтлөн, гарсан шийдвэрүүдээс Action plan автоматаар үүсгэх систем.\n\n- Яриаг хураангуйлан тэмдэглэх\n- Ажлын биелэлтийн хугацааг сануулах\n- Төслийн системд ажлуудыг бүртгэх', votes: 7, voters: [] },
            { id: 'p9', category: CAT_MANAGEMENT, teamInfo: 'Team Tsogtbayar', projectName: 'Зураг төслийн Agent', description: 'Инженерийн зураг төслийн норм дүрэм, стандартын дагуу хиймэл оюунд суурилсан дизайны хувилбаруудыг санал болгох систем.\n\n- Норм дүрмийн зөрчлийн мэдэгдэл\n- Generative design хувилбарууд гаргах\n- Материалын орцын жагсаалт (BoQ) боловсруулах', votes: 6, voters: [] },
            { id: 'p10', category: CAT_OPERATIONS, teamInfo: 'Team Khurtsdulguun', projectName: 'DCD (Тархмал сүлжээг хянах)', description: 'Тархмал сүлжээний бүрэлдэхүүн хэсгүүдийн өгөгдөлд анализ хийж, эвдрэл гэмтлийг урьдчилан таамаглах систем.\n\n- Хүчин чадал хэтрэх эрсдэлийн мэдэгдэл\n- Сүлжээний найдвартай байдлыг хянах\n- Засварын зардлыг бууруулах санал гаргах', votes: 5, voters: [] },
            { id: 'p11', category: CAT_OPERATIONS, teamInfo: 'Team Ganbat', projectName: 'Ухаалаг тоолуур + AI', description: 'Ухаалаг тоолууруудаас ирж буй өгөгдөлд анализ хийж, техникийн болон арилжааны алдагдлыг илрүүлэх систем.\n\n- Хөндлөнгийн оролцооны анхааруулга\n- Алдагдлын голомтыг үнэн зөв илрүүлэх\n- Хяналт шалгалтыг оновчлох зөвлөм гаргах', votes: 5, voters: [] },
            { id: 'p12', category: CAT_OPERATIONS, teamInfo: 'Team Ganbat', projectName: 'Хэрэглэгчийн зан төлөвийн AI', description: 'Хэрэглэгчдийн хэрэглээний зан төлөвт урьдчилан таамаглах анализ хийж, оновчтой тарифын багцыг санал болгох систем.\n\n- Хэрэглээний хэв маягийн өөрчлөлтийн мэдэгдэл\n- Ирээдүйн ачааллын муруй гаргах\n- Хэрэглээг оновчлох зөвлөмж өгөх', votes: 4, voters: [] },
            { id: 'p13', category: CAT_OPERATIONS, teamInfo: 'Team Ganbat', projectName: 'Цаг агаарын Forecast Agent', description: 'Цаг агаарын урьдчилсан мэдээнд үндэслэн үүсэж болзошгүй гэмтэл, саатлын байршлыг таамаглах систем.\n\n- Байгалийн гамшгийн үеийн сануулга\n- Хүний нөөц, техникийг оновчтой хуваарилах\n- Гэмтлийн байршлыг урьдчилан таамаглах', votes: 4, voters: [] },
            { id: 'p14', category: CAT_OPERATIONS, teamInfo: 'Team Gantulga', projectName: 'Work Order Үүсгэдэг Agent', description: 'Мэдрэгчүүдийн датанд анализ хийж болзошгүй эвдрэлийг илрүүлэн, автоматаар засварын Work Request үүсгэх систем.\n\n- Эвдрэлийн таамаглал, зардлын тооцоо\n- Сэлбэг хэрэгслийн зөвлөмж гаргах\n- Худалдан авалтын хүсэлт (PR) автоматаар үүсгэх', votes: 3, voters: [] },
            { id: 'p15', category: CAT_OPERATIONS, teamInfo: 'Team Gantulga', projectName: 'Тайлан хийдэг Agent', description: 'Засвар үйлчилгээний болон зардлын чиг хандлагад анализ хийж, өдөр тутмын тайлангуудыг автоматаар бэлтгэх систем.\n\n- Зардал хэтрэлтийн анхааруулга\n- Тоноглолыг шинэчлэх эдийн засгийн үнэлгээ\n- Тайлангуудыг хүний оролцоогүй үүсгэх', votes: 3, voters: [] },
            { id: 'p16', category: CAT_OPERATIONS, teamInfo: 'Team Gantulga', projectName: 'Засварын зөвлөмж Bot', description: 'Инженерүүдэд газар дээр нь засварын зааварчилгаа, аюулгүй ажиллагааны зөвлөмжийг чат хэлбэрээр өгөх туслах.\n\n- Аюулгүй ажиллагааны эрсдэлийн сануулга\n- Засварын зааварчилгааг шуурхай хариулах\n- Гүйцэтгэлийн тайланг автоматаар үүсгэх', votes: 2, voters: [] },
            { id: 'p17', category: CAT_OPERATIONS, teamInfo: 'Team Munkhsaikhan', projectName: 'SCADA - Хяналтын Agents', description: 'SCADA системээс ирж буй бодит хугацааны өгөгдөлд дүн шинжилгээ хийж, тоноглолын элэгдэл, насжилтыг тооцоолох систем.\n\n- Онцгой SCADA event мэдэгдэл\n- Кабелийн гэмтлийг эрт илрүүлэх\n- Тоноглолыг солих хугацааг тооцоолох', votes: 2, voters: [] },
            { id: 'p18', category: CAT_OPERATIONS, teamInfo: 'Team Munkhsaikhan', projectName: 'Data Quality Manager', description: 'Системүүдээс орж ирж буй өгөгдлийн чанарыг тогтмол шалгаж, дутуу болон стандартын бус датаг цэвэрлэх систем.\n\n- Өгөгдлийн урсгал тасалдлын мэдэгдэл\n- Алдаатай датаг автоматаар цэвэрлэх\n- Мэдээллийн чанарын хяналтын тайлан үүсгэх', votes: 1, voters: [] }
        ];

        const App = () => {
            const [view, setView] = useState('form'); 
            const [currentSlide, setCurrentSlide] = useState(0);
            const [user, setUser] = useState(null);
            const [toastMsg, setToastMsg] = useState('');
            const [isSaving, setIsSaving] = useState(false);
            const [selectedTab, setSelectedTab] = useState('All'); 
            const [votingIdeas, setVotingIdeas] = useState(PREDEFINED_IDEAS);
            const [selectedIdeaDetail, setSelectedIdeaDetail] = useState(null);

            const initialIdea = {
                members: '', projectName: '', targetUser: '', category: CAT_MANAGEMENT, problem: '',
                solutionStep1: '', solutionStep2: '', businessValueDesc: ''
            };

            const [ideas, setIdeas] = useState([{ ...initialIdea }]);
            const [currentIndex, setCurrentIndex] = useState(0);
            
            const client = useMemo(() => {
                if (typeof window.supabase !== 'undefined') {
                    return window.supabase.createClient(supabaseUrl, supabaseKey);
                }
                return null;
            }, []);

            const activeIdea = useMemo(() => ideas[currentIndex] || initialIdea, [ideas, currentIndex]);

            useEffect(() => {
                let localUserId = localStorage.getItem('pitch_voter_id');
                if (!localUserId) {
                    localUserId = 'user_' + Math.random().toString(36).substr(2, 9);
                    localStorage.setItem('pitch_voter_id', localUserId);
                }
                setUser({ uid: localUserId });
            }, []);

            const fetchVotingData = async () => {
                if (!client) return;
                try {
                    const { data: dbIdeas, error } = await client.from('pitch_voting').select('*');
                    if (error) throw error;

                    const dbIdeaMap = {};
                    if (dbIdeas) {
                        dbIdeas.forEach(idea => dbIdeaMap[idea.id] = idea);
                    }

                    let combined = PREDEFINED_IDEAS.map(pIdea => {
                        return dbIdeaMap[pIdea.id] ? dbIdeaMap[pIdea.id] : pIdea;
                    });

                    if (dbIdeas) {
                        dbIdeas.forEach(idea => {
                            if (!PREDEFINED_IDEAS.find(p => p.id === idea.id)) {
                                combined.push(idea);
                            }
                        });
                    }

                    combined.sort((a, b) => (b.votes || 0) - (a.votes || 0));
                    setVotingIdeas(combined);
                } catch (e) {
                    console.error("Fetch error:", e);
                }
            };

            useEffect(() => {
                if (!client) return;
                
                // Анхны өгөгдлийг татах
                fetchVotingData();

                // WebSocket хориглогдсон тул 5 секунд тутамд шинэчлэх (Polling)
                const intervalId = setInterval(() => {
                    fetchVotingData();
                }, 5000);

                return () => clearInterval(intervalId);
            }, [client]);

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 3000);
            };

            const toggleVote = async (idea) => {
                if (!user || !client) return;
                const hasVoted = idea.voters && idea.voters.includes(user.uid);
                let newVoters = idea.voters || [];
                let newVotes = idea.votes || 0;

                if (hasVoted) {
                    newVoters = newVoters.filter(uid => uid !== user.uid);
                    newVotes = Math.max(0, newVotes - 1);
                } else {
                    newVoters = [...newVoters, user.uid];
                    newVotes = newVotes + 1;
                }

                const { error } = await client.from('pitch_voting').upsert({
                    id: idea.id,
                    votes: newVotes,
                    voters: newVoters,
                    projectName: idea.projectName,
                    teamInfo: idea.teamInfo,
                    description: idea.description,
                    category: idea.category
                });
                
                if (error) {
                    showToast("Санал өгөхөд алдаа гарлаа");
                } else {
                    fetchVotingData(); // Санал өгсний дараа шууд шинэчлэх
                }
            };

            const publishToVoting = async () => {
                if (!client || !user) return showToast("Өгөгдлийн сан холбогдоогүй байна");
                
                if (!activeIdea.projectName || !activeIdea.members) {
                    return showToast("Мэдээллийг бүрэн оруулна уу");
                }

                setIsSaving(true);
                const uniqueId = `workshop_${user.uid}_${currentIndex}`;
                const desc = `Асуудал: ${activeIdea.problem}\n\nШийдэл: ${activeIdea.solutionStep1}, ${activeIdea.solutionStep2}\n\nҮнэ цэн: ${activeIdea.businessValueDesc}`;

                try {
                    const { error } = await client.from('pitch_voting').upsert({
                        id: uniqueId,
                        teamInfo: activeIdea.members,
                        projectName: activeIdea.projectName,
                        description: desc,
                        category: activeIdea.category,
                        isNewWorkshopIdea: true,
                        createdAt: new Date().toISOString()
                    });

                    if (error) throw error;
                    
                    await fetchVotingData(); // Илгээсний дараа өгөгдлийг шууд татах
                    showToast("Санал хураалтад илгээгдлээ");
                    setView('voting');
                } catch (error) {
                    showToast("Алдаа гарлаа: " + error.message);
                }
                setIsSaving(false);
            };

            const handleChange = (e) => {
                const { name, value } = e.target;
                setIdeas(prev => {
                    const next = [...prev];
                    next[currentIndex] = { ...next[currentIndex], [name]: value };
                    return next;
                });
            };

            const addNewIdea = () => {
                setIdeas([...ideas, { ...initialIdea }]);
                setCurrentIndex(ideas.length);
            };

            const removeIdea = (index, e) => {
                e.stopPropagation();
                if (ideas.length === 1) return;
                const newIdeas = ideas.filter((_, i) => i !== index);
                setIdeas(newIdeas);
                setCurrentIndex(Math.min(currentIndex, newIdeas.length - 1));
            };

            const renderToast = () => {
                if (!toastMsg) return null;
                return (
                    <div className="fixed top-6 right-6 bg-slate-800 border border-slate-600 text-white px-5 py-3 rounded-lg shadow-xl z-[100] flex items-center gap-3 text-sm" style={{animation: 'slideUp 0.3s ease-out'}}>
                        <span className="font-medium">{toastMsg}</span>
                    </div>
                );
            };

            const renderTopNav = () => (
                <div className="flex justify-center mb-6">
                    <div className="bg-slate-800/60 p-1 rounded-xl border border-slate-700 flex space-x-1">
                        <button onClick={() => setView('form')} className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${view === 'form' ? 'bg-cyan-500/20 text-cyan-400' : 'text-slate-400 hover:text-slate-200'}`}>Боловсруулах</button>
                        <button onClick={() => setView('voting')} className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${view === 'voting' ? 'bg-emerald-500/20 text-emerald-400' : 'text-slate-400 hover:text-slate-200'}`}>Санал хураалт</button>
                    </div>
                </div>
            );

            const renderVotingView = () => {
                const filtered = selectedTab === 'All' ? votingIdeas : votingIdeas.filter(i => i.category === selectedTab);
                return (
                    <div className="max-w-7xl mx-auto p-6 bg-slate-900 min-h-screen">
                        {renderTopNav()}
                        <div className="flex flex-col mb-8 bg-slate-800/40 p-6 rounded-2xl border border-slate-700 text-center">
                            <h1 className="text-3xl font-bold text-white mb-4 tracking-tight uppercase">AI in Enterprise</h1>
                            <div className="flex justify-center flex-wrap gap-2">
                                {['All', CAT_MANAGEMENT, CAT_OPERATIONS].map(tab => (
                                    <button key={tab} onClick={() => setSelectedTab(tab)} className={`px-4 py-2 rounded-lg text-xs font-bold border transition-colors ${selectedTab === tab ? 'bg-white text-slate-900 border-white' : 'bg-slate-800 text-slate-400 border-slate-700 hover:border-slate-500'}`}>
                                        {tab === 'All' ? 'Бүгд' : tab}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {filtered.map((idea) => (
                                <div key={idea.id} onClick={() => setSelectedIdeaDetail(idea)} className="bg-slate-800/50 p-6 rounded-xl border border-slate-700 hover:border-cyan-500/50 transition-all cursor-pointer relative flex flex-col group shadow-lg">
                                    <div className="text-[10px] uppercase font-bold text-slate-500 mb-2">{idea.category}</div>
                                    <h3 className="text-lg font-bold text-white mb-2 group-hover:text-cyan-400">{idea.projectName}</h3>
                                    <p className="text-sm text-slate-400 line-clamp-3 mb-4 leading-relaxed">{idea.description}</p>
                                    <div className="mt-auto pt-4 border-t border-slate-700 flex justify-between items-center" onClick={e => e.stopPropagation()}>
                                        <div className="text-xl font-bold text-slate-200">Санал: {idea.votes || 0}</div>
                                        <button onClick={() => toggleVote(idea)} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${idea.voters?.includes(user?.uid) ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/50' : 'bg-slate-700 text-slate-300 border border-slate-600 hover:bg-slate-600'}`}>
                                            {idea.voters?.includes(user?.uid) ? 'Өгсөн' : 'Өгөх'}
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {selectedIdeaDetail && (
                            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-[150] flex items-center justify-center p-4" onClick={() => setSelectedIdeaDetail(null)}>
                                <div className="bg-slate-800 border border-slate-600 p-8 rounded-2xl max-w-2xl w-full shadow-2xl" onClick={e => e.stopPropagation()}>
                                    <h2 className="text-2xl font-bold text-white mb-4 border-b border-slate-700 pb-2">{selectedIdeaDetail.projectName}</h2>
                                    <div className="text-slate-300 whitespace-pre-wrap text-sm leading-relaxed mb-8 max-h-[60vh] overflow-y-auto custom-scrollbar pr-2">
                                        {selectedIdeaDetail.description}
                                    </div>
                                    <button onClick={() => setSelectedIdeaDetail(null)} className="w-full py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-bold transition-colors">Хаах</button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            const renderFormView = () => (
                <div className="max-w-4xl mx-auto p-6 bg-slate-900 min-h-screen text-slate-200">
                    {renderTopNav()}
                    <div className="bg-slate-800/40 p-6 rounded-2xl border border-slate-700 mb-6 flex justify-between items-center shadow-md">
                        <h1 className="text-2xl font-bold text-white tracking-tight uppercase">AI in Enterprise</h1>
                        <button onClick={publishToVoting} disabled={isSaving} className="bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2.5 px-6 rounded-xl transition-all shadow-lg text-sm border border-cyan-500/50">
                            {isSaving ? 'Илгээж байна...' : 'САНАЛ ХУРААЛТАД ИЛГЭЭХ'}
                        </button>
                    </div>

                    <div className="flex overflow-x-auto space-x-2 mb-6 pb-2 custom-scrollbar">
                        {ideas.map((idea, idx) => (
                            <button key={idx} onClick={() => setCurrentIndex(idx)} className={`px-4 py-2 rounded-xl text-sm font-medium transition-all ${currentIndex === idx ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/30' : 'bg-slate-800/60 text-slate-400 border border-slate-700 hover:bg-slate-700'}`}>
                                {idea.projectName || `Санаа ${idx + 1}`}
                                {ideas.length > 1 && <span onClick={(e) => removeIdea(idx, e)} className="ml-2 text-rose-500 hover:text-rose-400">✕</span>}
                            </button>
                        ))}
                        <button onClick={addNewIdea} className="px-4 py-2 rounded-xl text-sm font-medium text-slate-400 border border-slate-600 border-dashed hover:text-cyan-400 hover:border-cyan-500 transition-all">Шинэ санаа</button>
                    </div>

                    <div className="space-y-4" style={{animation: 'fadeIn 0.3s ease-out'}}>
                        <div className="bg-slate-800/50 p-6 rounded-xl border border-slate-700 shadow-inner">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div className="space-y-1">
                                    <label className="text-[10px] uppercase font-bold text-slate-500 ml-1">Баг / Илтгэгч</label>
                                    <input type="text" name="members" value={activeIdea.members} onChange={handleChange} className="w-full p-3 bg-slate-900/50 border border-slate-700 rounded-lg outline-none focus:border-cyan-500 text-sm text-white" placeholder="Багийн нэр" />
                                </div>
                                <div className="space-y-1">
                                    <label className="text-[10px] uppercase font-bold text-slate-500 ml-1">Төслийн нэр</label>
                                    <input type="text" name="projectName" value={activeIdea.projectName} onChange={handleChange} className="w-full p-3 bg-slate-900/50 border border-slate-700 rounded-lg outline-none focus:border-cyan-500 text-sm text-white" placeholder="Төслийн нэр" />
                                </div>
                                <div className="space-y-1">
                                    <label className="text-[10px] uppercase font-bold text-slate-500 ml-1">Ангилал</label>
                                    <select name="category" value={activeIdea.category} onChange={handleChange} className="w-full p-3 bg-slate-900/50 border border-slate-700 rounded-lg outline-none focus:border-cyan-500 text-sm text-white">
                                        <option value={CAT_MANAGEMENT}>{CAT_MANAGEMENT}</option>
                                        <option value={CAT_OPERATIONS}>{CAT_OPERATIONS}</option>
                                    </select>
                                </div>
                                <div className="space-y-1">
                                    <label className="text-[10px] uppercase font-bold text-slate-500 ml-1">Хэрэглэгч</label>
                                    <input type="text" name="targetUser" value={activeIdea.targetUser} onChange={handleChange} className="w-full p-3 bg-slate-900/50 border border-slate-700 rounded-lg outline-none focus:border-cyan-500 text-sm text-white" placeholder="Хэрэглэгч" />
                                </div>
                            </div>
                        </div>
                        <div className="space-y-1">
                            <label className="text-[10px] uppercase font-bold text-slate-500 ml-1">1. Асуудал</label>
                            <textarea name="problem" value={activeIdea.problem} onChange={handleChange} rows="3" className="w-full p-4 bg-slate-800/50 border border-slate-700 rounded-xl outline-none focus:border-rose-500 text-sm text-white resize-none" placeholder="Асуудлын тайлбар..."></textarea>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="space-y-1">
                                <label className="text-[10px] uppercase font-bold text-slate-500 ml-1">Шийдлийн алхам 1</label>
                                <input type="text" name="solutionStep1" value={activeIdea.solutionStep1} onChange={handleChange} className="w-full p-3 bg-slate-900/50 border border-slate-700 rounded-lg outline-none focus:border-cyan-500 text-sm text-white" placeholder="Алхам 1..." />
                            </div>
                            <div className="space-y-1">
                                <label className="text-[10px] uppercase font-bold text-slate-500 ml-1">Шийдлийн алхам 2</label>
                                <input type="text" name="solutionStep2" value={activeIdea.solutionStep2} onChange={handleChange} className="w-full p-3 bg-slate-900/50 border border-slate-700 rounded-lg outline-none focus:border-cyan-500 text-sm text-white" placeholder="Алхам 2..." />
                            </div>
                        </div>
                        <div className="space-y-1">
                            <label className="text-[10px] uppercase font-bold text-slate-500 ml-1">3. Бизнесийн үнэ цэн</label>
                            <textarea name="businessValueDesc" value={activeIdea.businessValueDesc} onChange={handleChange} rows="2" className="w-full p-4 bg-slate-800/50 border border-slate-700 rounded-xl outline-none focus:border-emerald-500 text-sm text-white resize-none" placeholder="Үр өгөөжийн тайлбар..."></textarea>
                        </div>
                        <div className="flex justify-center pt-4">
                             <button onClick={() => {setCurrentSlide(0); setView('presentation');}} className="px-8 py-3 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold text-sm transition-colors border border-slate-600">ТАНИЛЦУУЛАХ (СЛАЙД)</button>
                        </div>
                    </div>
                </div>
            );

            const renderPresentationView = () => (
                <div className="fixed inset-0 bg-[#0a0f1c] z-50 flex items-center justify-center p-20 text-center" onClick={() => setView('form')}>
                    <div className="max-w-4xl" style={{animation: 'fadeIn 0.5s ease-out'}}>
                        <h1 className="text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-500 mb-8 uppercase tracking-tighter">{activeIdea.projectName || 'AI in Enterprise'}</h1>
                        <p className="text-2xl text-cyan-400 mb-12 font-medium tracking-widest uppercase">Хэрэглэгч: {activeIdea.targetUser}</p>
                        <div className="text-3xl text-slate-300 font-light leading-relaxed border-l-4 border-cyan-500 pl-8 text-left">{activeIdea.problem}</div>
                        <div className="mt-24 text-slate-600 text-xs uppercase tracking-[0.3em] font-bold">Буцахын тулд хаана нэгтээ дарна уу</div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-slate-900 relative">
                    {renderToast()}
                    {view === 'voting' ? renderVotingView() : (view === 'form' ? renderFormView() : renderPresentationView())}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
