<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI in Enterprise - Pitch App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
        body { background-color: #0f172a; margin: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ==========================================
        // SUPABASE ТОХИРГОО (ХОЛБОЛТ АМЖИЛТТАЙ)
        // ==========================================
        const supabaseUrl = 'https://yyprkhrmvlpiknq qbpww.supabase.co'; // Таны URL-ийн зайг арилгаж оруулна уу
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5cHJraHJtdmxwaWtucXFicHd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MDE3NTEsImV4cCI6MjA5MzQ3Nzc1MX0.qRuIVqaqBdv3n95fAezZAEFAP7FNCqZ-RsEPJoYmE0U';
        
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        const CAT_MANAGEMENT = 'Төслийн удирдлага ба Төлөвлөлт';
        const CAT_OPERATIONS = 'Ашиглалт, Засвар үйлчилгээ, түгээх (O&M) бизнес';

        // Өмнөх Workshop-ийн дата
        const PREDEFINED_IDEAS = [
            { id: 'p1', category: CAT_MANAGEMENT, teamInfo: 'Team Munkhchuluun', projectName: 'Legal Chat Agent (PCR)', description: 'Улсын болон орон нутгийн Хууль, журам, зөвшөөрөл, нийцэл, захирамж зэрэг зохицуулалттай холбоотой нэгдсэн мэдлэгийн санг үүсгэж (open data, shuukh.mn, legal info, e-mongolia API), сангийн мэдээлэл дээр үндэслэн:\n\nТогтмол мэдэгдэл (Alert): Хууль журмын шинэчлэлт, өөрчлөлтийн талаарх мэдээллийг цаг тухайд нь илгээх.\nУхаалаг Чатбот: Хэрэглэгчийн асуултын дагуу хуулийн уялдаа, бүрдүүлэх баримт бичиг, үе шат, хугацаа, хураамж, эрсдэл болон харьяа байгууллагын мэдээллийг цогцоор нь өгөх.\nТуршлагад суурилсан зөвлөмж: Өмнөх бодит туршлага болон дотоод мэдээллийн санд үндэслэн асуудал шийдвэрлэх арга зам, бодит хугацааны санал гаргах.\nБичиг баримтын автоматжуулалт: Зөвлөмжийн дагуу шаардлагатай бичиг баримтыг бүрдүүлэх, албан бичгийн ноорог (draft) автоматаар боловсруулах.', votes: 15, voters: [] },
            { id: 'p2', category: CAT_MANAGEMENT, teamInfo: 'Team Tsogtbayar', projectName: 'Tender Research Agent', description: 'Гадаад болон дотоодын тендерийн нээлттэй мэдээллийн санг байгууллагын профайл, үйл ажиллагааны чиглэлтэй уялдуулан нэгтгэх бөгөөд уг мэдээлэл дээр үндэслэн:\n\nТогтмол мэдэгдэл (Alert): Компанийн шалгуур, нөөц боломжид нийцэхүйц шинэ тендер зарлагдсан тухай бүрд холбогдох мэдээллийг цаг алдалгүй илгээх.\nУхаалаг хайлт ба Анализ: Олон эх сурвалжаас тендерийн мэдээллийг шүүж, тавигдах шаардлага, тендерийн баримт бичигт дүн шинжилгээ хийн, оролцох боломжийг үнэлэх, тендерийн санал автоматаар бэлтгэх систем.\nТуршлагад суурилсан зөвлөмж: Өмнө нь оролцож байсан болон ялсан тендерүүдийн туршлага, өрсөлдөгчдийн мэдээлэлд тулгуурлан үнийн санал, стратегийн талаар оновчтой санал гаргах.\nБичиг баримтын автоматжуулалт: Тендерийн шаардлагад нийцүүлэн компанийн танилцуулга, туршлага, аргачлал зэргийг нэгтгэн тендерийн саналын (Proposal) эхний нооргийг автоматаар боловсруулах.', votes: 12, voters: [] },
            { id: 'p3', category: CAT_MANAGEMENT, teamInfo: 'Team Lkhagvaragchaa', projectName: 'Lesson Learned Bot', description: 'Өмнөх төслүүдийн туршлага, алдаа оноог (Lessons learned) цуглуулан ангилж мэдлэгийн сан үүсгэх бөгөөд уг сангийн өгөгдөл болон аудио мэдээлэл дээр үндэслэн:\n\nМэдээлэл цуглуулалт ба хөрвүүлэлт: "Chimege Voice-to-text" систем ашиглан хурлын тэмдэглэл, яриа зэрэг аудио мэдээллийг текст рүү хөрвүүлэн боловсруулж, мэдлэгийн санг автоматаар баяжуулах.\nУхаалаг сануулга (Alert): Долоо хоногийн төлөвлөгөө гаргах эсвэл шинэ төсөл эхлүүлэх үед өмнө нь гарч байсан ижил төстэй алдаа, эрсдэлүүдийн талаарх сануулгыг цаг тухайд нь илгээх.\nТуршлагад суурилсан зөвлөмж: Өнгөрсөн төслүүдийн ололт амжилт, алдаа оноонд анализ хийж, одоогийн төслийн явцад тулгарч болох асуудлуудыг шийдвэрлэх шилдэг туршлагуудыг санал болгох.\nТөлөвлөлтийн автоматжуулалт: Өмнөх өгөгдөл болон сургамжууд дээр үндэслэн илүү сайжруулсан, эрсдэл багатай төслийн төлөвлөгөө эсвэл долоо хоногийн ажлын хуваарийн санал (draft) боловсруулах.', votes: 11, voters: [] },
            { id: 'p10', category: CAT_OPERATIONS, teamInfo: 'Team Khurtsdulguun', projectName: 'DCD (Тархмал сүлжээг хянах систем)', description: 'Тархмал сүлжээний бүрэлдэхүүн хэсгүүдийн өгөгдлийн сан (Data storage) үүсгэж, уг мэдээлэл дээр үндэслэн:\n\nТогтмол мэдэгдэл (Alert): Сүлжээнд доголдол үүсэх, хүчин чадал хэтрэх эсвэл эвдрэл гарах эрсдэлтэй үед холбогдох инженерүүдэд яаралтай мэдэгдэл илгээх.\nУхаалаг Анализ: Сүлжээний ачаалал болон өгөгдөлд хиймэл оюун ухаанаар тооцоолол хийж, эвдрэл гэмтлийг урьдчилан таамаглах, сүлжээний найдвартай байдлыг хянах.\nТуршлагад суурилсан зөвлөмж: Өмнөх эвдрэл гэмтлийн түүх болон засварын мэдээлэлд үндэслэн төсөв хэрхэн оновчтой төлөвлөх, засварын зардлыг бууруулах талаар санал гаргах.\nБичиг баримтын автоматжуулалт: Сүлжээний ажиллагааны нэгдсэн тайлан, гэмтлийн акт, ээлжит төсвийн төлөвлөгөөний нооргийг (draft) автоматаар боловсруулах.', votes: 5, voters: [] }
        ];

        const PitchApp = () => {
            const [view, setView] = useState('form'); 
            const [currentSlide, setCurrentSlide] = useState(0);
            const [user, setUser] = useState(null);
            const [toastMsg, setToastMsg] = useState('');
            const [isSaving, setIsSaving] = useState(false);
            const [selectedTab, setSelectedTab] = useState('All'); 
            const [votingIdeas, setVotingIdeas] = useState(PREDEFINED_IDEAS);
            const [selectedIdeaDetail, setSelectedIdeaDetail] = useState(null);

            const initialIdea = {
                members: '', projectName: '', targetUser: '', category: CAT_MANAGEMENT, problem: '',
                solutionStep1: '', solutionStep2: '', solutionStep3: '', solutionStep4: '',
                businessValueLevel: 'High', businessValueDesc: '', dataReq: '', implSteps: '', implTime: ''
            };

            const [ideas, setIdeas] = useState([{ ...initialIdea }]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const activeIdea = ideas[currentIndex];

            // 1. Unique User ID үүсгэх (Local)
            useEffect(() => {
                let localUserId = localStorage.getItem('pitch_voter_id');
                if (!localUserId) {
                    localUserId = 'user_' + Math.random().toString(36).substr(2, 9);
                    localStorage.setItem('pitch_voter_id', localUserId);
                }
                setUser({ uid: localUserId });
            }, []);

            // 2. Supabase-ээс Realtime дата татах
            const fetchVotingData = async () => {
                const { data: dbIdeas, error } = await db.from('pitch_voting').select('*');
                if (error) {
                    console.error("Fetch error:", error);
                    return;
                }

                const dbIdeaMap = {};
                dbIdeas.forEach(idea => dbIdeaMap[idea.id] = idea);

                let combined = PREDEFINED_IDEAS.map(pIdea => {
                    return dbIdeaMap[pIdea.id] ? dbIdeaMap[pIdea.id] : pIdea;
                });

                dbIdeas.forEach(idea => {
                    if (!PREDEFINED_IDEAS.find(p => p.id === idea.id)) {
                        combined.push(idea);
                    }
                });

                combined.sort((a, b) => (b.votes || 0) - (a.votes || 0));
                setVotingIdeas(combined);
            };

            useEffect(() => {
                fetchVotingData();
                const subscription = db.channel('pitch_changes')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'pitch_voting' }, () => fetchVotingData())
                    .subscribe();
                return () => db.removeChannel(subscription);
            }, []);

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 3000);
            };

            // 3. Санал өгөх (Supabase Update)
            const toggleVote = async (idea) => {
                if (!user) return;
                const hasVoted = idea.voters && idea.voters.includes(user.uid);
                
                let newVoters = idea.voters || [];
                let newVotes = idea.votes || 0;

                if (hasVoted) {
                    newVoters = newVoters.filter(uid => uid !== user.uid);
                    newVotes = Math.max(0, newVotes - 1);
                } else {
                    newVoters = [...newVoters, user.uid];
                    newVotes = newVotes + 1;
                }

                const { error } = await db.from('pitch_voting').upsert({
                    id: idea.id,
                    votes: newVotes,
                    voters: newVoters,
                    projectName: idea.projectName,
                    teamInfo: idea.teamInfo,
                    description: idea.description,
                    category: idea.category
                });

                if (error) showToast("Алдаа гарлаа");
            };

            // 4. Төслийг DB рүү илгээх
            const publishToVoting = async () => {
                if (!activeIdea.projectName || !activeIdea.members) {
                    return showToast("Төслийн нэр болон гишүүдийг оруулна уу");
                }

                setIsSaving(true);
                const uniqueId = `workshop_${user.uid}_${currentIndex}`;
                const desc = `Асуудал: ${activeIdea.problem}\n\nШийдэл:\n1. ${activeIdea.solutionStep1}\n2. ${activeIdea.solutionStep2}\n\nҮнэ цэн: ${activeIdea.businessValueDesc}`;

                const { error } = await db.from('pitch_voting').upsert({
                    id: uniqueId,
                    teamInfo: activeIdea.members,
                    projectName: activeIdea.projectName,
                    description: desc,
                    category: activeIdea.category,
                    isNewWorkshopIdea: true,
                    createdAt: new Date().toISOString()
                });

                setIsSaving(false);
                if (!error) {
                    showToast("Санал хураалтад илгээгдлээ");
                    setView('voting');
                }
            };

            const handleChange = (e) => {
                const { name, value } = e.target;
                const updatedIdeas = [...ideas];
                updatedIdeas[currentIndex] = { ...updatedIdeas[currentIndex], [name]: value };
                setIdeas(updatedIdeas);
            };

            const addNewIdea = () => {
                setIdeas([...ideas, { ...initialIdea }]);
                setCurrentIndex(ideas.length);
            };

            const removeIdea = (index, e) => {
                e.stopPropagation();
                if (ideas.length === 1) return;
                const newIdeas = ideas.filter((_, i) => i !== index);
                setIdeas(newIdeas);
                setCurrentIndex(Math.min(currentIndex, newIdeas.length - 1));
            };

            const TopNav = () => (
                <div className="flex justify-center mb-6">
                    <div className="bg-slate-800/60 p-1 rounded-xl border border-slate-700 flex space-x-1">
                        <button onClick={() => setView('form')} className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${view === 'form' ? 'bg-cyan-500/20 text-cyan-400' : 'text-slate-400'}`}>Боловсруулах</button>
                        <button onClick={() => setView('voting')} className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${view === 'voting' ? 'bg-emerald-500/20 text-emerald-400' : 'text-slate-400'}`}>Санал хураалт</button>
                    </div>
                </div>
            );

            const VotingView = () => {
                const filtered = selectedTab === 'All' ? votingIdeas : votingIdeas.filter(i => i.category === selectedTab);
                return (
                    <div className="max-w-7xl mx-auto p-6 bg-slate-900 min-h-screen text-slate-200">
                        <TopNav />
                        <div className="flex flex-col mb-8 bg-slate-800/40 p-6 rounded-2xl border border-slate-700 text-center">
                            <h1 className="text-3xl font-bold text-white mb-4 tracking-tight">AI in Enterprise</h1>
                            <div className="flex justify-center gap-2">
                                {['All', CAT_MANAGEMENT, CAT_OPERATIONS].map(tab => (
                                    <button key={tab} onClick={() => setSelectedTab(tab)} className={`px-4 py-2 rounded-lg text-xs font-bold border ${selectedTab === tab ? 'bg-white text-slate-900 border-white' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>
                                        {tab === 'All' ? 'Бүгд' : tab}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {filtered.map((idea) => (
                                <div key={idea.id} onClick={() => setSelectedIdeaDetail(idea)} className="bg-slate-800/50 p-6 rounded-xl border border-slate-700 hover:border-cyan-500/50 transition-all cursor-pointer relative flex flex-col">
                                    <div className="text-[10px] uppercase font-bold text-slate-500 mb-2">{idea.category}</div>
                                    <h3 className="text-lg font-bold text-white mb-2">{idea.projectName}</h3>
                                    <p className="text-sm text-slate-400 line-clamp-3 mb-4">{idea.description}</p>
                                    <div className="mt-auto pt-4 border-t border-slate-700 flex justify-between items-center" onClick={e => e.stopPropagation()}>
                                        <div className="text-xl font-bold">Санал: {idea.votes || 0}</div>
                                        <button onClick={() => toggleVote(idea)} className={`px-4 py-1.5 rounded-lg text-xs font-bold ${idea.voters?.includes(user?.uid) ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-700 text-slate-300'}`}>
                                            {idea.voters?.includes(user?.uid) ? 'Өгсөн' : 'Өгөх'}
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {selectedIdeaDetail && (
                            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-[100] flex items-center justify-center p-4" onClick={() => setSelectedIdeaDetail(null)}>
                                <div className="bg-slate-800 border border-slate-700 p-8 rounded-2xl max-w-2xl w-full" onClick={e => e.stopPropagation()}>
                                    <h2 className="text-2xl font-bold text-white mb-4">{selectedIdeaDetail.projectName}</h2>
                                    <div className="text-slate-300 whitespace-pre-wrap text-sm leading-relaxed mb-8 max-h-96 overflow-y-auto custom-scrollbar">{selectedIdeaDetail.description}</div>
                                    <button onClick={() => setSelectedIdeaDetail(null)} className="w-full py-3 bg-slate-700 text-white rounded-xl font-bold">Хаах</button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            const FormView = () => (
                <div className="max-w-4xl mx-auto p-6 bg-slate-900 min-h-screen text-slate-200">
                    <ToastMessage />
                    <TopNav />
                    <div className="bg-slate-800/40 p-6 rounded-2xl border border-slate-700 mb-6 flex justify-between items-center">
                        <h1 className="text-2xl font-bold text-white tracking-tight">AI in Enterprise</h1>
                        <button onClick={publishToVoting} disabled={isSaving} className="bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2 px-6 rounded-xl transition-all shadow-lg text-sm">
                            САНАЛ ХУРААЛТАД ИЛГЭЭХ
                        </button>
                    </div>

                    <div className="space-y-4">
                        <div className="bg-slate-800/50 p-6 rounded-xl border border-slate-700">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <input type="text" name="members" value={activeIdea.members} onChange={handleChange} className="p-3 bg-slate-900/50 border border-slate-700 rounded-lg outline-none focus:border-cyan-500 text-sm" placeholder="Багийн илтгэгч / Гишүүд" />
                                <input type="text" name="projectName" value={activeIdea.projectName} onChange={handleChange} className="p-3 bg-slate-900/50 border border-slate-700 rounded-lg outline-none focus:border-cyan-500 text-sm" placeholder="Төслийн нэр" />
                                <select name="category" value={activeIdea.category} onChange={handleChange} className="p-3 bg-slate-900/50 border border-slate-700 rounded-lg outline-none focus:border-cyan-500 text-sm">
                                    <option value={CAT_MANAGEMENT}>{CAT_MANAGEMENT}</option>
                                    <option value={CAT_OPERATIONS}>{CAT_OPERATIONS}</option>
                                </select>
                                <input type="text" name="targetUser" value={activeIdea.targetUser} onChange={handleChange} className="p-3 bg-slate-900/50 border border-slate-700 rounded-lg outline-none focus:border-cyan-500 text-sm" placeholder="Хэрэглэгч" />
                            </div>
                        </div>
                        <textarea name="problem" value={activeIdea.problem} onChange={handleChange} rows="3" className="w-full p-4 bg-slate-800/50 border border-slate-700 rounded-xl outline-none focus:border-rose-500 text-sm resize-none" placeholder="1. Асуудал"></textarea>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input type="text" name="solutionStep1" value={activeIdea.solutionStep1} onChange={handleChange} className="p-3 bg-slate-800/50 border border-slate-700 rounded-xl outline-none focus:border-cyan-500 text-sm" placeholder="Шийдлийн алхам 1" />
                            <input type="text" name="solutionStep2" value={activeIdea.solutionStep2} onChange={handleChange} className="p-3 bg-slate-800/50 border border-slate-700 rounded-xl outline-none focus:border-cyan-500 text-sm" placeholder="Шийдлийн алхам 2" />
                        </div>
                        <textarea name="businessValueDesc" value={activeIdea.businessValueDesc} onChange={handleChange} rows="2" className="w-full p-4 bg-slate-800/50 border border-slate-700 rounded-xl outline-none focus:border-emerald-500 text-sm resize-none" placeholder="3. Бизнесийн үнэ цэн"></textarea>
                    </div>
                </div>
            );

            // Презентаци харагдацыг хэвээр үлдээв
            const PresentationView = () => (
                <div className="fixed inset-0 bg-[#0a0f1c] z-50 flex items-center justify-center p-20 text-center" onClick={() => setView('form')}>
                    <div className="max-w-4xl">
                        <h1 className="text-7xl font-black text-white mb-8">{activeIdea.projectName || 'AI in Enterprise'}</h1>
                        <p className="text-2xl text-cyan-400 mb-12">Хэрэглэгч: {activeIdea.targetUser}</p>
                        <div className="text-3xl text-slate-300 font-light leading-relaxed">{activeIdea.problem}</div>
                        <div className="mt-20 text-slate-500 text-sm uppercase tracking-widest font-bold">Гарахын тулд хаа нэгтээ дарна уу</div>
                    </div>
                </div>
            );

            if (view === 'voting') return <VotingView />;
            return view === 'form' ? <FormView /> : <PresentationView />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PitchApp />);
    </script>
</body>
</html>
