        // Мэдээлэл задлах функцууд - scope алдаа гаргахгүй байх үүднээс function-аар зарлав
        function extractMeta(desc) {
            let v = 'Medium', f = 'Medium', s = false, e = false, text = desc || '', fd = '';
            if (text.startsWith('[Meta-')) {
                const end = text.indexOf(']');
                if (end > -1) {
                    text.substring(6, end).split('|').forEach(p => {
                        if(p.startsWith('V:')) v = p.replace('V:', '');
                        if(p.startsWith('F:')) f = p.replace('F:', '');
                        if(p.startsWith('S:')) s = p.replace('S:', '') === 'true';
                        if(p.startsWith('E:')) e = p.replace('E:', '') === 'true';
                    });
                    text = text.substring(end + 1).trim();
                }
            }
            const div = '---FEAS_DESC---';
            const idx = text.indexOf(div);
            if (idx > -1) { 
                fd = text.substring(idx + div.length).trim(); 
                text = text.substring(0, idx).trim(); 
            }
            return { valueLevel: v, feasLevel: f, isShortlisted: s, isEvaluated: e, cleanDesc: text, feasDesc: fd };
        }

        function extractPPMeta(desc) {
            let imp = 'None', urg = 'None', txt = desc || '', disc = '';
            if (txt.startsWith('[PP-')) {
                const end = txt.indexOf(']');
                if (end > -1) {
                    txt.substring(4, end).split('|').forEach(p => { 
                        if(p.startsWith('Impact:')) imp = p.replace('Impact:', ''); 
                        if(p.startsWith('Urgency:')) urg = p.replace('Urgency:', ''); 
                    });
                    txt = txt.substring(end + 1).trim();
                }
            }
            const div = '---DISCUSSION---';
            const idx = txt.indexOf(div);
            if (idx > -1) { disc = txt.substring(idx + div.length).trim(); txt = txt.substring(0, idx).trim(); }
            return { impact: imp, urgency: urg, cleanText: txt, discussion: disc };
        }

        function getFeasScore(lvl) {
            return lvl === 'High' ? 3 : (lvl === 'Medium' ? 2 : 1);
        }

        // Саналын тооноос хамаарч Бизнес үнэ цэнийг динамикаар тодорхойлох функц
        function getDynamicValueLevel(votes) {
            const v = votes || 0;
            if (v >= 10) return 'High';
            if (v >= 5) return 'Medium';
            return 'Low';
        }

        // Styling functions
        function getDeptColor(dept) {
            const d = (dept || '').trim();
            if (d === 'Хүний нөөц') return { border: 'border-pink-500/40', bg: 'bg-pink-500/10', text: 'text-pink-400', hover: 'hover:border-pink-500/80', glow: 'shadow-[0_0_15px_rgba(236,72,153,0.05)]' };
            if (d === 'Худалдан авалт') return { border: 'border-sky-500/40', bg: 'bg-sky-500/10', text: 'text-sky-400', hover: 'hover:border-sky-500/80', glow: 'shadow-[0_0_15px_rgba(14,165,233,0.05)]' };
            if (d === 'Санхүү') return { border: 'border-emerald-500/40', bg: 'bg-emerald-500/10', text: 'text-emerald-400', hover: 'hover:border-emerald-500/80', glow: 'shadow-[0_0_15px_rgba(16,185,129,0.05)]' };
            if (d === 'Хууль нийцэл, гэрээ') return { border: 'border-violet-500/40', bg: 'bg-violet-500/10', text: 'text-violet-400', hover: 'hover:border-violet-500/80', glow: 'shadow-[0_0_15px_rgba(139,92,246,0.05)]' };
            return { border: 'border-slate-600/50', bg: 'bg-slate-700/30', text: 'text-slate-300', hover: 'hover:border-slate-500', glow: 'shadow-lg' };
        }

        function getTabStyle(dept, isSelected) {
            if (dept === 'Нийт') return isSelected ? 'bg-fuchsia-600 text-white border-fuchsia-500 shadow-[0_0_15px_rgba(217,70,239,0.4)]' : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700';
            if (dept === 'Хүний нөөц') return isSelected ? 'bg-pink-600 text-white border-pink-500 shadow-[0_0_15px_rgba(236,72,153,0.4)]' : 'bg-slate-800 text-pink-400 border-slate-700 hover:bg-pink-900/30 hover:border-pink-500/50';
            if (dept === 'Худалдан авалт') return isSelected ? 'bg-sky-600 text-white border-sky-500 shadow-[0_0_15px_rgba(14,165,233,0.4)]' : 'bg-slate-800 text-sky-400 border-slate-700 hover:bg-sky-900/30 hover:border-sky-500/50';
            if (dept === 'Санхүү') return isSelected ? 'bg-emerald-600 text-white border-emerald-500 shadow-[0_0_15px_rgba(16,185,129,0.4)]' : 'bg-slate-800 text-emerald-400 border-slate-700 hover:bg-emerald-900/30 hover:border-emerald-500/50';
            if (dept === 'Хууль нийцэл, гэрээ') return isSelected ? 'bg-violet-600 text-white border-violet-500 shadow-[0_0_15px_rgba(139,92,246,0.4)]' : 'bg-slate-800 text-violet-400 border-slate-700 hover:bg-violet-900/30 hover:border-violet-500/50';
            return isSelected ? 'bg-slate-600 text-white border-slate-500 shadow-md' : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700';
        }

        const colorPalettes = [
            { border: 'border-rose-500/40', bg: 'bg-rose-500/10', text: 'text-rose-400', hover: 'group-hover:border-rose-500/80', glow: 'hover:shadow-[0_0_20px_rgba(244,63,94,0.15)]' },
            { border: 'border-blue-500/40', bg: 'bg-blue-500/10', text: 'text-blue-400', hover: 'group-hover:border-blue-500/80', glow: 'hover:shadow-[0_0_20px_rgba(59,130,246,0.15)]' },
            { border: 'border-emerald-500/40', bg: 'bg-emerald-500/10', text: 'text-emerald-400', hover: 'group-hover:border-emerald-500/80', glow: 'hover:shadow-[0_0_20px_rgba(16,185,129,0.15)]' },
            { border: 'border-yellow-500/40', bg: 'bg-yellow-500/10', text: 'text-yellow-400', hover: 'group-hover:border-yellow-500/80', glow: 'hover:shadow-[0_0_20px_rgba(234,179,8,0.15)]' },
            { border: 'border-indigo-500/40', bg: 'bg-indigo-500/10', text: 'text-indigo-400', hover: 'group-hover:border-indigo-500/80', glow: 'hover:shadow-[0_0_20px_rgba(99,102,241,0.15)]' },
            { border: 'border-teal-500/40', bg: 'bg-teal-500/10', text: 'text-teal-400', hover: 'group-hover:border-teal-500/80', glow: 'hover:shadow-[0_0_20px_rgba(20,184,166,0.15)]' },
            { border: 'border-orange-500/40', bg: 'bg-orange-500/10', text: 'text-orange-400', hover: 'group-hover:border-orange-500/80', glow: 'hover:shadow-[0_0_20px_rgba(249,115,22,0.15)]' },
            { border: 'border-purple-500/40', bg: 'bg-purple-500/10', text: 'text-purple-400', hover: 'group-hover:border-purple-500/80', glow: 'hover:shadow-[0_0_20px_rgba(168,85,247,0.15)]' },
            { border: 'border-pink-500/40', bg: 'bg-pink-500/10', text: 'text-pink-400', hover: 'group-hover:border-pink-500/80', glow: 'hover:shadow-[0_0_20px_rgba(236,72,153,0.15)]' },
            { border: 'border-cyan-500/40', bg: 'bg-cyan-500/10', text: 'text-cyan-400', hover: 'group-hover:border-cyan-500/80', glow: 'hover:shadow-[0_0_20px_rgba(6,182,212,0.15)]' },
            { border: 'border-lime-500/40', bg: 'bg-lime-500/10', text: 'text-lime-400', hover: 'group-hover:border-lime-500/80', glow: 'hover:shadow-[0_0_20px_rgba(132,204,22,0.15)]' },
            { border: 'border-fuchsia-500/40', bg: 'bg-fuchsia-500/10', text: 'text-fuchsia-400', hover: 'group-hover:border-fuchsia-500/80', glow: 'hover:shadow-[0_0_20px_rgba(217,70,239,0.15)]' }
        ];

        function getTeamColor(team) {
            const t = (team || '').trim();
            if (!t) return { border: 'border-slate-700', bg: 'bg-slate-800', text: 'text-slate-300', hover: 'group-hover:border-slate-500', glow: '' };
            
            const tl = t.toLowerCase();
            if(tl.includes('munkhchuluun')) return colorPalettes[0];
            if(tl.includes('tsogtbayar')) return colorPalettes[1];
            if(tl.includes('lkhagvaragchaa')) return colorPalettes[2];
            if(tl.includes('khurtsdulguun')) return colorPalettes[3];
            if(tl.includes('ganbat')) return colorPalettes[4];
            if(tl.includes('gantulga')) return colorPalettes[5];
            if(tl.includes('munkhsaikhan')) return colorPalettes[6];
            
            let hash = 0;
            for (let i = 0; i < t.length; i++) {
                hash = t.charCodeAt(i) + ((hash << 5) - hash);
            }
            hash = Math.abs(hash);
            return colorPalettes[(hash % 5) + 7]; 
        }

        function getMatrixQuadrant(impact, urgency) {
            if (impact === 'High' && urgency === 'Urgent') return { label: 'CRITICAL', bg: 'bg-rose-500/20 text-rose-400 border-rose-500/30' };
            if (impact === 'High' && urgency === 'Not Urgent') return { label: 'STRATEGIC', bg: 'bg-orange-500/20 text-orange-400 border-orange-500/30' };
            if (impact === 'Low' && urgency === 'Urgent') return { label: 'QUICK WIN', bg: 'bg-yellow-500/20 text-yellow-400 border-yellow-500/30' };
            if (impact === 'Low' && urgency === 'Not Urgent') return { label: 'LOW PRIORITY', bg: 'bg-slate-500/20 text-slate-400 border-slate-500/30' };
            return { label: 'ҮНЭЛГЭЭГҮЙ', bg: 'bg-slate-700/50 text-slate-400 border-slate-600/50' };
        }

        // --- Prioritization Matrix Component ---
        const PrioritizationMatrix = ({ painPoints }) => {
            const critical = painPoints.filter(p => { const m = extractPPMeta(p.description); return m.impact === 'High' && m.urgency === 'Urgent'; });
            const strategic = painPoints.filter(p => { const m = extractPPMeta(p.description); return m.impact === 'High' && m.urgency === 'Not Urgent'; });
            const quickWin = painPoints.filter(p => { const m = extractPPMeta(p.description); return m.impact === 'Low' && m.urgency === 'Urgent'; });
            const lowPriority = painPoints.filter(p => { const m = extractPPMeta(p.description); return m.impact === 'Low' && m.urgency === 'Not Urgent'; });

            const renderChip = (pp, color) => (
                <div key={pp.id} className={`bg-slate-900/80 p-2.5 rounded-xl mb-2.5 border border-${color}-500/30 text-xs shadow-md transition-all hover:-translate-y-0.5`}>
                    <div className="font-bold text-slate-200 truncate mb-1">{pp.projectName || pp.projectname}</div>
                    <div className={`text-${color}-200/80 line-clamp-2`}>{extractPPMeta(pp.description).cleanText}</div>
                </div>
            );

            return (
                <div className="bg-slate-800/40 p-6 md:p-8 rounded-3xl border border-slate-700 shadow-xl mb-10 w-full animate-[fadeIn_0.5s_ease-out]">
                    <h2 className="text-2xl font-bold text-white mb-8 uppercase tracking-wide text-center">Prioritization Matrix</h2>
                    
                    <div className="relative max-w-4xl mx-auto pl-10 pr-6 py-6 mb-4">
                        {/* Y-axis Label */}
                        <div className="absolute left-0 top-0 bottom-0 w-10 flex flex-col justify-between items-center py-10">
                            <span className="text-slate-500 text-[10px] font-black uppercase tracking-widest -rotate-90 whitespace-nowrap mb-8">High Impact</span>
                            <div className="w-0.5 h-full bg-slate-600/50 relative">
                                <div className="absolute -top-1 -left-1 w-2.5 h-2.5 bg-slate-500 rounded-full"></div>
                                <div className="absolute -bottom-1 -left-1 w-2.5 h-2.5 bg-slate-500 rounded-full"></div>
                            </div>
                            <span className="text-slate-500 text-[10px] font-black uppercase tracking-widest -rotate-90 whitespace-nowrap mt-8">Low Impact</span>
                        </div>

                        {/* 2x2 Grid */}
                        <div className="grid grid-cols-2 gap-4 h-[500px]">
                            <div className="bg-orange-900/10 border border-orange-500/20 rounded-2xl p-4 flex flex-col hover:border-orange-500/40 transition-colors min-h-0">
                                <h3 className="text-orange-400 font-bold mb-3 uppercase tracking-wider text-xs border-b border-orange-500/20 pb-2 shrink-0">Strategic (Урт хугацаанд)</h3>
                                <div className="flex-1 overflow-y-auto custom-scrollbar pr-2 min-h-0">
                                    {strategic.length === 0 ? <p className="text-orange-500/30 text-xs italic">Асуудал алга</p> : strategic.map(p => renderChip(p, 'orange'))}
                                </div>
                            </div>
                            <div className="bg-rose-900/10 border border-rose-500/20 rounded-2xl p-4 flex flex-col hover:border-rose-500/40 transition-colors min-h-0">
                                <h3 className="text-rose-400 font-bold mb-3 uppercase tracking-wider text-xs border-b border-rose-500/20 pb-2 shrink-0">Critical (Яаралтай)</h3>
                                <div className="flex-1 overflow-y-auto custom-scrollbar pr-2 min-h-0">
                                    {critical.length === 0 ? <p className="text-rose-500/30 text-xs italic">Асуудал алга</p> : critical.map(p => renderChip(p, 'rose'))}
                                </div>
                            </div>
                            <div className="bg-slate-800/30 border border-slate-600/30 rounded-2xl p-4 flex flex-col hover:border-slate-500/50 transition-colors min-h-0">
                                <h3 className="text-slate-400 font-bold mb-3 uppercase tracking-wider text-xs border-b border-slate-600/30 pb-2 shrink-0">Low Priority (Хойшлуулах)</h3>
                                <div className="flex-1 overflow-y-auto custom-scrollbar pr-2 min-h-0">
                                    {lowPriority.length === 0 ? <p className="text-slate-500/30 text-xs italic">Асуудал алга</p> : lowPriority.map(p => renderChip(p, 'slate'))}
                                </div>
                            </div>
                            <div className="bg-yellow-900/10 border border-yellow-500/20 rounded-2xl p-4 flex flex-col hover:border-yellow-500/40 transition-colors min-h-0">
                                <h3 className="text-yellow-400 font-bold mb-3 uppercase tracking-wider text-xs border-b border-yellow-500/20 pb-2 shrink-0">Quick Win (Шуурхай шийдэл)</h3>
                                <div className="flex-1 overflow-y-auto custom-scrollbar pr-2 min-h-0">
                                    {quickWin.length === 0 ? <p className="text-yellow-500/30 text-xs italic">Асуудал алга</p> : quickWin.map(p => renderChip(p, 'yellow'))}
                                </div>
                            </div>
                        </div>

                        {/* X-axis Label */}
                        <div className="absolute bottom-0 left-10 right-0 h-10 flex justify-between items-center px-4 translate-y-12">
                            <span className="text-slate-500 text-[10px] font-black uppercase tracking-widest">Not Urgent</span>
                            <div className="flex-grow h-0.5 bg-slate-600/50 mx-4 relative">
                                <div className="absolute -left-1 -top-1 w-2.5 h-2.5 bg-slate-500 rounded-full"></div>
                                <div className="absolute -right-1 -top-1 w-2.5 h-2.5 bg-slate-500 rounded-full"></div>
                            </div>
                            <span className="text-slate-500 text-[10px] font-black uppercase tracking-widest">Urgent</span>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('voting'); 
            const [user, setUser] = useState(null);
            const [toastMsg, setToastMsg] = useState('');
            const [selectedTab, setSelectedTab] = useState('All'); 
            const [votingIdeas, setVotingIdeas] = useState(PREDEFINED_IDEAS);
            const [selectedId, setSelectedId] = useState(null);
            
            const [cDept, setCDept] = useState('Нийт');
            const [ePPId, setEPPId] = useState(null); 
            
            const [mFeas, setMFeas] = useState('Medium');
            const [mFeasDesc, setMFeasDesc] = useState('');

            const client = useMemo(() => typeof window.supabase !== 'undefined' ? window.supabase.createClient(supabaseUrl, supabaseKey) : null, []);
            const selIdea = useMemo(() => votingIdeas.find(i => i.id === selectedId) || null, [votingIdeas, selectedId]);
            const selPP = useMemo(() => votingIdeas.find(i => i.id === ePPId) || null, [votingIdeas, ePPId]);

            useEffect(() => {
                const uid = localStorage.getItem('pitch_voter_id') || 'user_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('pitch_voter_id', uid);
                setUser({ uid });
            }, []);

            // 1. САНАЛЫН ТООГООР эрэмбэлэх
            // 2. ИЖИЛ САНАЛТАЙ үед 2 үнэлгээний нийлбэрээр (Үнэ цэн + Боломж) эрэмбэлэх
            const sortArr = (arr) => [...arr].sort((a, b) => {
                const isPPA = a.category === CAT_PAINPOINT;
                const isPPB = b.category === CAT_PAINPOINT;
                
                // Pain points хооронд бол саналаар нь
                if (isPPA && isPPB) return (b.votes || 0) - (a.votes || 0);
                if (isPPA) return 1;
                if (isPPB) return -1;

                // 1-р эрэмбэ: Саналын тоо
                const votesA = a.votes || 0;
                const votesB = b.votes || 0;
                
                if (votesB !== votesA) {
                    return votesB - votesA;
                }

                // 2-р эрэмбэ: Ижил саналтай үед 2 үнэлгээний нийлбэр (High=3, Medium=2, Low=1)
                const metaA = extractMeta(a.description);
                const metaB = extractMeta(b.description);
                
                const scoreA = getFeasScore(getDynamicValueLevel(votesA)) + getFeasScore(metaA.feasLevel);
                const scoreB = getFeasScore(getDynamicValueLevel(votesB)) + getFeasScore(metaB.feasLevel);

                return scoreB - scoreA;
            });

            const refreshData = async () => {
                if (!client) return;
                const { data } = await client.from('pitch_voting').select('*');
                if (data) {
                    const map = {};
                    data.forEach(d => map[d.id] = { ...d, projectName: d.projectname || d.projectName, teamInfo: d.teaminfo || d.teamInfo });
                    let res = PREDEFINED_IDEAS.map(p => map[p.id] || p);
                    data.forEach(d => { if(!PREDEFINED_IDEAS.find(p => p.id === d.id)) res.push(map[d.id]); });
                    setVotingIdeas(sortArr(res));
                }
            };

            useEffect(() => {
                if (!client) { setVotingIdeas(sortArr(PREDEFINED_IDEAS)); return; }
                refreshData();
                const int = setInterval(refreshData, 5000);
                return () => clearInterval(int);
            }, [client]);

            const showToast = (m) => { setToastMsg(m); setTimeout(() => setToastMsg(''), 3000); };
            const renderToast = () => toastMsg ? <div className="fixed top-6 right-6 bg-slate-800 border border-slate-600 text-white px-5 py-3 rounded-lg shadow-xl z-[400]" style={{animation: 'slideUp 0.3s ease-out'}}><span className="font-medium">{toastMsg}</span></div> : null;

            // Нууц татах функцууд
            const downloadExcel = () => {
                const headers = ['Ангилал', 'Төслийн нэр', 'Баг', 'Нийт Санал', 'Бизнесийн үнэ цэн', 'Технологийн боломж (Feasibility)', 'Shortlisted', 'Асуудал & Шийдэл', 'Feasibility Тайлбар'];
                const escapeCSV = (str) => str ? `"${str.toString().replace(/"/g, '""')}"` : '""';
                const csvRows = [headers.join(',')];
                votingIdeas.filter(i => i.category !== CAT_PAINPOINT).forEach(idea => {
                    const meta = extractMeta(idea.description);
                    const dynValue = getDynamicValueLevel(idea.votes);
                    csvRows.push([ escapeCSV(idea.category), escapeCSV(idea.projectName), escapeCSV(idea.teamInfo), idea.votes || 0, escapeCSV(dynValue), escapeCSV(meta.feasLevel), escapeCSV(meta.isShortlisted ? 'Тийм' : 'Үгүй'), escapeCSV(meta.cleanDesc), escapeCSV(meta.feasDesc) ].join(','));
                });
                const blob = new Blob(['\uFEFF' + csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.setAttribute('href', URL.createObjectURL(blob));
                link.setAttribute('download', 'Idea_Workshop_Export.csv');
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            };

            const downloadPainPoints = () => {
                const headers = ['Ангилал', 'Хэлтэс', 'Бүртгэсэн хүн', 'Асуудал', 'Ярилцсан зүйл', 'Нөлөөлөл', 'Яаралтай', 'Санал'];
                const escapeCSV = (str) => str ? `"${str.toString().replace(/"/g, '""')}"` : '""';
                const csvRows = [headers.join(',')];
                votingIdeas.filter(i => i.category === CAT_PAINPOINT).forEach(pp => {
                    const m = extractPPMeta(pp.description);
                    csvRows.push([ escapeCSV(pp.category), escapeCSV(pp.teamInfo || pp.teaminfo), escapeCSV(pp.projectName || pp.projectname), escapeCSV(m.cleanText), escapeCSV(m.discussion), escapeCSV(m.impact), escapeCSV(m.urgency), pp.votes || 0 ].join(','));
                });
                const blob = new Blob(['\uFEFF' + csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.setAttribute('href', URL.createObjectURL(blob));
                link.setAttribute('download', 'PainPoints_Export.csv');
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            };

            const onVote = async (idea) => {
                const uid = user?.uid || 'local';
                const voted = idea.voters?.includes(uid);
                let vts = idea.votes || 0, vtrs = idea.voters || [];
                if(voted) { vtrs = vtrs.filter(i => i !== uid); vts = Math.max(0, vts - 1); }
                else { vtrs = [...vtrs, uid]; vts++; }
                setVotingIdeas(p => sortArr(p.map(i => i.id === idea.id ? { ...i, votes: vts, voters: vtrs } : i)));
                if(client) await client.from('pitch_voting').upsert({ id: idea.id, votes: vts, voters: vtrs, projectname: idea.projectName || idea.projectname || 'Pain Point', teaminfo: idea.teamInfo || idea.teaminfo, description: idea.description, category: idea.category });
            };
            
            const onSaveFeas = async () => {
                if(!selIdea) return;
                const m = extractMeta(selIdea.description);
                const dynValue = getDynamicValueLevel(selIdea.votes);
                const d = `[Meta-V:${dynValue}|F:${mFeas}|S:${m.isShortlisted}|E:true]\n${m.cleanDesc}${mFeasDesc ? '\n\n---FEAS_DESC---\n' + mFeasDesc : ''}`;
                setVotingIdeas(p => sortArr(p.map(i => i.id === selIdea.id ? { ...i, description: d } : i)));
                if(client) await client.from('pitch_voting').upsert({ id: selIdea.id, votes: selIdea.votes, voters: selIdea.voters, projectname: selIdea.projectName, teaminfo: selIdea.teamInfo, category: selIdea.category, description: d });
                showToast("Технологийн үнэлгээ амжилттай хадгалагдаж түгжигдлээ!");
                setSelectedId(null); 
            };

            const onToggleShortlist = async (idea, e) => {
                if (e) e.stopPropagation();
                const m = extractMeta(idea.description);
                const newS = !m.isShortlisted;
                const dynValue = getDynamicValueLevel(idea.votes);
                const d = `[Meta-V:${dynValue}|F:${m.feasLevel}|S:${newS}|E:${m.isEvaluated}]\n${m.cleanDesc}${m.feasDesc ? '\n\n---FEAS_DESC---\n' + m.feasDesc : ''}`;
                
                setVotingIdeas(p => sortArr(p.map(i => i.id === idea.id ? { ...i, description: d } : i)));
                if(client) await client.from('pitch_voting').upsert({ id: idea.id, votes: idea.votes, voters: idea.voters, projectname: idea.projectName || idea.projectname, teaminfo: idea.teamInfo || idea.teaminfo, category: idea.category, description: d });
                showToast(newS ? "⭐ Shortlist-д амжилттай нэмэгдлээ!" : "Shortlist-ээс хасагдлаа!");
            };

            const getDeptCount = (dept) => {
                if (dept === 'Нийт') return votingIdeas.filter(i => i.category === CAT_PAINPOINT).length;
                return votingIdeas.filter(i => i.category === CAT_PAINPOINT && (i.teamInfo === dept || i.teaminfo === dept)).length;
            };

            const getIdeaCount = (tab) => {
                const actual = votingIdeas.filter(i => i.category !== CAT_PAINPOINT);
                if (tab === 'All') return actual.length;
                if (tab === 'Shortlisted') return actual.filter(i => extractMeta(i.description).isShortlisted).length;
                return actual.filter(i => i.category === tab).length;
            };

            const renderNav = () => (

                                    </div>

                                    <div className="pt-4 mt-4 border-t border-slate-800 flex justify-between items-center shrink-0">
                                        <div className="text-2xl font-black text-white flex flex-col"><span className="text-[9px] font-bold text-emerald-400 uppercase tracking-widest mb-0.5">Нийт санал</span>{selIdea.votes || 0}</div>
                                        <button onClick={() => onVote(selIdea)} className={`px-8 py-3 rounded-xl text-sm font-bold shadow-lg transition-all ${selIdea.voters?.includes(user?.uid) ? 'bg-emerald-500 text-slate-900' : 'bg-cyan-600 text-white hover:bg-cyan-500'}`}>{selIdea.voters?.includes(user?.uid) ? '✓ Санал өгсөн' : 'Санал өгөх'}</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
