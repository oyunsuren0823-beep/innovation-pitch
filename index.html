<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovation Pitch App - DB Connected</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase Import Map -->
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
        }
      }
    </script>

    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
        body { background-color: #0f172a; margin: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, doc, setDoc } from 'firebase/firestore';

        const { useState, useEffect } = React;

        // Firebase Initialization (Canvas орчинд автоматаар холбогдоно)
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        let app, auth, db;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        if (firebaseConfig) {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        }

        const PitchApp = () => {
            const [view, setView] = useState('form'); 
            const [currentSlide, setCurrentSlide] = useState(0);
            const [user, setUser] = useState(null);
            
            // Notification states
            const [toastMsg, setToastMsg] = useState('');
            const [isSaving, setIsSaving] = useState(false);

            const initialIdea = {
                members: '',
                projectName: '',
                targetUser: '',
                problem: '',
                solutionStep1: '',
                solutionStep2: '',
                solutionStep3: '',
                solutionStep4: '',
                businessValueLevel: 'High',
                businessValueDesc: '',
                dataReq: '',
                implSteps: '',
                implTime: ''
            };

            const [ideas, setIdeas] = useState([{ ...initialIdea }]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const activeIdea = ideas[currentIndex];

            // DB Auth холболт үүсгэх
            useEffect(() => {
                if (!auth) return;
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (error) {
                        console.error("Auth error:", error);
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 3000);
            };

            // DB рүү өгөгдөл хадгалах функц
            const saveToDatabase = async () => {
                if (!db || !user) {
                    showToast("⚠️ Өгөгдлийн сан холбогдоогүй байна (Local горим)");
                    return;
                }
                
                setIsSaving(true);
                try {
                    // Багуудын өгөгдлийг public дата баазад тэдний ID-аар хадгална
                    // Ингэснээр зохион байгуулагч бүх багийн датаг харах боломжтой болно
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'pitch_ideas', user.uid);
                    await setDoc(docRef, {
                        teamInfo: ideas[0].members || 'Unknown Team',
                        ideas: ideas,
                        updatedAt: new Date().toISOString()
                    });
                    showToast("✅ Мэдээлэл өгөгдлийн санд амжилттай хадгалагдлаа!");
                } catch (error) {
                    console.error("DB Save Error:", error);
                    showToast("❌ Хадгалахад алдаа гарлаа");
                }
                setIsSaving(false);
            };

            const handleChange = (e) => {
                const { name, value } = e.target;
                const updatedIdeas = [...ideas];
                updatedIdeas[currentIndex] = { ...updatedIdeas[currentIndex], [name]: value };
                setIdeas(updatedIdeas);
            };

            const addNewIdea = () => {
                setIdeas([...ideas, { ...initialIdea }]);
                setCurrentIndex(ideas.length);
            };

            const removeIdea = (index, e) => {
                e.stopPropagation();
                if (ideas.length === 1) return;
                const newIdeas = ideas.filter((_, i) => i !== index);
                setIdeas(newIdeas);
                setCurrentIndex(Math.min(currentIndex, newIdeas.length - 1));
            };

            const downloadData = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(ideas, null, 2));
                const downloadNode = document.createElement('a');
                downloadNode.setAttribute("href", dataStr);
                const teamNameStr = ideas[0].members ? ideas[0].members.substring(0, 10).replace(/[^a-zA-Z0-9]/g, '') : 'Team';
                downloadNode.setAttribute("download", `Ideas_${teamNameStr}.json`);
                document.body.appendChild(downloadNode);
                downloadNode.click();
                downloadNode.remove();
            };

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (view === 'presentation') {
                        if (e.key === 'ArrowRight' || e.key === 'Space') {
                            setCurrentSlide((prev) => Math.min(prev + 1, 4));
                        } else if (e.key === 'ArrowLeft') {
                            setCurrentSlide((prev) => Math.max(prev - 1, 0));
                        } else if (e.key === 'Escape') {
                            setView('form');
                        }
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [view]);

            const ToastMessage = () => {
                if (!toastMsg) return null;
                return (
                    <div className="fixed top-6 right-6 bg-slate-800 border border-slate-600 text-white px-6 py-4 rounded-xl shadow-2xl z-[100] flex items-center gap-3" style={{animation: 'slideUp 0.3s ease-out'}}>
                        <span className="font-semibold">{toastMsg}</span>
                    </div>
                );
            };

            const FormView = () => (
                <div className="max-w-6xl mx-auto p-4 md:p-8 relative z-10 bg-slate-900 min-h-screen">
                    <ToastMessage />
                    
                    {/* Admin Local Download */}
                    <button onClick={downloadData} className="fixed bottom-4 left-4 text-slate-600 hover:text-cyan-400 p-3 rounded-full transition-all duration-300 z-50 opacity-30 hover:opacity-100 hover:bg-slate-800" title="Local татах">
                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    </button>

                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 bg-slate-800/40 backdrop-blur-xl p-8 rounded-3xl border border-slate-700/50 shadow-2xl">
                        <div>
                            <h1 className="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400 tracking-tight">INNOVATION PITCH</h1>
                            <p className="text-slate-400 mt-2 text-lg">AI & Автоматжуулалтын төслийн санаа</p>
                        </div>
                        <div className="mt-6 md:mt-0 flex gap-4">
                            {/* Үүлэнд хадгалах товч (Database) */}
                            <button 
                                onClick={saveToDatabase} 
                                disabled={isSaving}
                                className="bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold py-4 px-6 rounded-2xl flex items-center transition-all border border-slate-600"
                            >
                                {isSaving ? 'Хадгалж байна...' : '☁️ СЕРВЕРТ ХАДГАЛАХ'}
                            </button>
                            <button 
                                onClick={() => {setCurrentSlide(0); setView('presentation');}} 
                                className="bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white font-bold py-4 px-10 rounded-2xl flex items-center transition-all shadow-lg"
                            >
                                ТАНИЛЦУУЛАХ
                            </button>
                        </div>
                    </div>

                    <div className="flex overflow-x-auto space-x-3 mb-8 pb-2 custom-scrollbar">
                        {ideas.map((idea, idx) => (
                            <button key={idx} onClick={() => setCurrentIndex(idx)} className={`px-6 py-3 rounded-2xl font-semibold transition-all flex items-center ${currentIndex === idx ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/50' : 'bg-slate-800/60 text-slate-400 border border-slate-700'}`}>
                                {idea.projectName || `Санаа ${idx + 1}`}
                                {ideas.length > 1 && <span onClick={(e) => removeIdea(idx, e)} className="ml-3 text-slate-500 hover:text-rose-400">✕</span>}
                            </button>
                        ))}
                        <button onClick={addNewIdea} className="px-6 py-3 rounded-2xl font-semibold text-slate-400 border border-slate-600 border-dashed hover:text-cyan-400">＋ Шинэ санаа</button>
                    </div>

                    <div className="space-y-8" style={{animation: 'fadeIn 0.3s ease-in-out'}}>
                        {/* Ерөнхий мэдээлэл */}
                        <div className="bg-slate-800/60 p-8 rounded-3xl border border-slate-700">
                            <h2 className="text-2xl font-bold text-slate-100 mb-6 flex items-center"><span className="mr-3">🚀</span> Ерөнхий мэдээлэл</h2>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                {['members', 'projectName', 'targetUser'].map(field => (
                                    <div key={field} className="space-y-2">
                                        <label className="text-sm font-semibold text-slate-400 uppercase">{field === 'members' ? 'Гишүүд' : field === 'projectName' ? 'Төслийн нэр' : 'Хэрэглэгч'}</label>
                                        <input type="text" name={field} value={activeIdea[field]} onChange={handleChange} className="w-full p-4 bg-slate-900/50 border border-slate-700 rounded-xl text-slate-200 focus:border-indigo-500 outline-none" />
                                    </div>
                                ))}
                            </div>
                        </div>
                        {/* 1. Асуудал */}
                        <div className="bg-slate-800/60 p-8 rounded-3xl border border-rose-900/30">
                            <h2 className="text-2xl font-bold text-slate-100 mb-6 flex items-center"><span className="mr-3">⚠️</span> 1. Асуудал</h2>
                            <textarea name="problem" value={activeIdea.problem} onChange={handleChange} rows="3" className="w-full p-4 bg-slate-900/50 border border-slate-700 rounded-xl text-slate-200 focus:border-rose-500 outline-none resize-none"></textarea>
                        </div>
                        {/* 2. Шийдэл */}
                        <div className="bg-slate-800/60 p-8 rounded-3xl border border-cyan-900/30">
                            <h2 className="text-2xl font-bold text-slate-100 mb-6 flex items-center"><span className="mr-3">💡</span> 2. Шийдэл</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {[1,2,3,4].map(num => (
                                    <div key={num} className="space-y-2">
                                        <label className="text-sm font-semibold text-cyan-400/80">Алхам {num}</label>
                                        <input type="text" name={`solutionStep${num}`} value={activeIdea[`solutionStep${num}`]} onChange={handleChange} className="w-full p-4 bg-slate-900/50 border border-slate-700 rounded-xl text-slate-200 focus:border-cyan-500 outline-none" />
                                    </div>
                                ))}
                            </div>
                        </div>
                        {/* 3. Үнэ цэн */}
                        <div className="bg-slate-800/60 p-8 rounded-3xl border border-emerald-900/30">
                            <h2 className="text-2xl font-bold text-slate-100 mb-6 flex items-center"><span className="mr-3">📈</span> 3. Үнэ цэн</h2>
                            <div className="flex flex-col md:flex-row gap-8">
                                <select name="businessValueLevel" value={activeIdea.businessValueLevel} onChange={handleChange} className="md:w-1/3 p-4 bg-slate-900/50 border border-slate-700 rounded-xl text-slate-200 outline-none">
                                    <option value="High">Өндөр (High)</option>
                                    <option value="Medium">Дунд (Medium)</option>
                                    <option value="Low">Бага (Low)</option>
                                </select>
                                <textarea name="businessValueDesc" value={activeIdea.businessValueDesc} onChange={handleChange} rows="2" className="flex-grow p-4 bg-slate-900/50 border border-slate-700 rounded-xl text-slate-200 outline-none resize-none"></textarea>
                            </div>
                        </div>
                        {/* 4. Өгөгдөл & 5. Хэрэгжүүлэлт */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div className="bg-slate-800/60 p-8 rounded-3xl border border-fuchsia-900/30">
                                <h2 className="text-2xl font-bold text-slate-100 mb-6">4. Өгөгдөл</h2>
                                <textarea name="dataReq" value={activeIdea.dataReq} onChange={handleChange} rows="4" className="w-full p-4 bg-slate-900/50 border border-slate-700 rounded-xl text-slate-200 outline-none"></textarea>
                            </div>
                            <div className="bg-slate-800/60 p-8 rounded-3xl border border-amber-900/30 flex flex-col">
                                <h2 className="text-2xl font-bold text-slate-100 mb-6">5. Хэрэгжүүлэлт</h2>
                                <textarea name="implSteps" value={activeIdea.implSteps} onChange={handleChange} rows="2" className="w-full p-4 bg-slate-900/50 border border-slate-700 rounded-xl text-slate-200 outline-none mb-4 flex-grow"></textarea>
                                <div className="bg-slate-900 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
                                    <span className="text-amber-400 font-bold">MVP Хугацаа:</span>
                                    <input type="text" name="implTime" value={activeIdea.implTime} onChange={handleChange} className="bg-transparent border-b border-slate-600 text-right outline-none w-1/2 text-slate-200" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );

            // --- Слайдын хэсэг ---
            const PresentationView = () => {
                const Slide0 = () => (
                    <div className="flex flex-col items-center justify-center h-full text-center px-10 relative">
                        <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-indigo-900/20 via-slate-900 to-slate-900"></div>
                        <h1 className="text-7xl font-black text-transparent bg-clip-text bg-gradient-to-br from-cyan-300 via-indigo-400 to-purple-500 mb-8 relative z-10">{activeIdea.projectName || 'Төслийн нэр'}</h1>
                        <p className="text-3xl text-slate-400 mb-12 relative z-10">Хэрэглэгч: <span className="text-cyan-400">{activeIdea.targetUser || '...'}</span></p>
                        <div className="bg-slate-800/80 px-10 py-5 rounded-full border border-slate-700 relative z-10"><span className="text-2xl text-slate-200">{activeIdea.members || '...'}</span></div>
                    </div>
                );
                const Slide1 = () => (
                    <div className="flex flex-col h-full px-16 py-16">
                        <h2 className="text-5xl font-black text-white mb-16 flex items-center"><span className="bg-rose-500 w-16 h-16 rounded-2xl flex items-center justify-center mr-6">1</span> АСУУДАЛ</h2>
                        <div className="text-4xl text-slate-200 bg-slate-800/40 p-12 rounded-[2.5rem] border border-rose-500/20 flex-grow whitespace-pre-wrap">{activeIdea.problem}</div>
                    </div>
                );
                const Slide2 = () => (
                    <div className="flex flex-col h-full px-16 py-16">
                        <h2 className="text-5xl font-black text-white mb-12 flex items-center"><span className="bg-cyan-500 w-16 h-16 rounded-2xl flex items-center justify-center mr-6">2</span> ШИЙДЭЛ</h2>
                        <div className="grid grid-cols-2 gap-8 flex-grow">
                            {[1,2,3,4].map(n => (
                                <div key={n} className="bg-slate-800/60 p-10 rounded-[2rem] border border-slate-700 relative overflow-hidden">
                                    <div className="absolute -top-6 -right-6 text-8xl font-black text-slate-700/30">0{n}</div>
                                    <p className="text-3xl text-slate-200 relative z-10 mt-4">{activeIdea[`solutionStep${n}`]}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                );
                const Slide3 = () => (
                    <div className="flex flex-col h-full px-16 py-16 items-center justify-center space-y-16">
                        <h2 className="text-5xl font-black text-white absolute top-16 left-16 flex items-center"><span className="bg-emerald-500 w-16 h-16 rounded-2xl flex items-center justify-center mr-6">3</span> ҮНЭ ЦЭН</h2>
                        <div className="text-7xl font-black px-24 py-10 rounded-full border border-emerald-500/50 bg-emerald-900/20 text-emerald-400 shadow-[0_0_50px_rgba(16,185,129,0.3)]">{activeIdea.businessValueLevel} VALUE</div>
                        <div className="text-4xl text-slate-200 text-center max-w-5xl bg-slate-800/40 p-12 rounded-[3rem] border border-slate-700/50">{activeIdea.businessValueDesc}</div>
                    </div>
                );
                const Slide4 = () => (
                    <div className="flex flex-col h-full px-16 py-16">
                        <h2 className="text-5xl font-black text-white mb-12 flex items-center"><span className="bg-purple-500 w-16 h-16 rounded-2xl flex items-center justify-center mr-6">4</span> ӨГӨГДӨЛ & ХЭРЭГЖҮҮЛЭЛТ</h2>
                        <div className="grid grid-cols-2 gap-12 flex-grow">
                            <div className="bg-slate-800/50 p-12 rounded-[3rem] border border-slate-700"><h3 className="text-3xl font-bold text-fuchsia-400 mb-8 tracking-widest">ӨГӨГДӨЛ</h3><p className="text-3xl text-slate-300 whitespace-pre-wrap">{activeIdea.dataReq}</p></div>
                            <div className="bg-slate-800/50 p-12 rounded-[3rem] border border-slate-700 flex flex-col"><h3 className="text-3xl font-bold text-amber-400 mb-8 tracking-widest">ХЭРЭГЖҮҮЛЭЛТ</h3><p className="text-3xl text-slate-300 flex-grow whitespace-pre-wrap">{activeIdea.implSteps}</p><div className="bg-slate-900/80 p-8 rounded-3xl border border-amber-500/30 flex justify-between items-center"><span className="text-slate-400 text-xl tracking-widest">MVP Хугацаа</span><span className="text-5xl font-black text-amber-400">{activeIdea.implTime}</span></div></div>
                        </div>
                    </div>
                );

                const slides = [<Slide0/>, <Slide1/>, <Slide2/>, <Slide3/>, <Slide4/>];

                return (
                    <div className="fixed inset-0 bg-[#0a0f1c] z-50 flex flex-col p-4">
                        <button onClick={() => setView('form')} className="absolute top-8 left-8 z-[60] bg-slate-800/50 px-6 py-3 rounded-full text-white font-bold border border-slate-600 hover:bg-slate-700">← БУЦАХ</button>
                        <div className="flex-grow bg-[#0f172a] rounded-[3rem] shadow-[0_0_100px_rgba(0,0,0,0.8)] relative overflow-hidden border border-slate-800">
                            {slides[currentSlide]}
                            <div className="absolute bottom-10 left-0 right-0 flex justify-center space-x-8 items-center">
                                <button onClick={() => setCurrentSlide(p => Math.max(0, p-1))} className="p-4 rounded-full bg-slate-800 text-cyan-400 border border-slate-700">←</button>
                                <div className="flex space-x-4 px-6 py-3 rounded-full bg-slate-900 border border-slate-800">
                                    {slides.map((_, idx) => <div key={idx} className={`w-3 h-3 rounded-full transition-all ${idx === currentSlide ? 'bg-cyan-400 w-10' : 'bg-slate-600'}`}></div>)}
                                </div>
                                <button onClick={() => setCurrentSlide(p => Math.min(slides.length-1, p+1))} className="p-4 rounded-full bg-slate-800 text-cyan-400 border border-slate-700">→</button>
                            </div>
                        </div>
                    </div>
                );
            };

            return view === 'form' ? <FormView /> : <PresentationView />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PitchApp />);
    </script>
</body>
</html>
