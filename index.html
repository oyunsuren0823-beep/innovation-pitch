            { id: 'p2', category: CAT_MANAGEMENT, teamInfo: 'Team Tsogtbayar', projectName: 'Tender Research Agent', description: '[Meta-V:High|F:High]\nГадаад болон дотоодын тендерийн нээлттэй мэдээллийн санг байгууллагын профайлтай уялдуулан нэгтгэж, оролцох боломжийг үнэлэх систем.\n\n- Шинэ тендерийн мэдэгдэл\n- Тендерийн шаардлагад дүн шинжилгээ хийх\n- Тендерийн саналын эхний нооргийг боловсруулах', votes: 12, voters: [] },
            { id: 'p3', category: CAT_MANAGEMENT, teamInfo: 'Team Lkhagvaragchaa', projectName: 'Lesson Learned Bot', description: '[Meta-V:Medium|F:High]\nӨмнөх төслүүдийн туршлага, алдаа оноог цуглуулан ангилж, шинэ төсөл эхлүүлэх үед зөвлөмж өгөх туслах.\n\n- Chimege Voice-to-text ашиглан аудиог текст болгох\n- Эрсдэлийн сануулга илгээх\n- Өмнөх өгөгдөл дээр үндэслэн төлөвлөгөө сайжруулах', votes: 11, voters: [] },
            { id: 'p4', category: CAT_MANAGEMENT, teamInfo: 'Team Lkhagvaragchaa', projectName: 'PMBOK Multi agents', description: '[Meta-V:High|F:Low]\nPMBOK аргачлалд суурилсан төлөвлөлт, гүйцэтгэл, эрсдэлийн хяналтыг нэгтгэсэн олон агент бүхий систем.\n\n- Нөөц, хугацааны оновчтой хуваарилалт\n- Гүйцэтгэлийн аудит хийх\n- Хазайлтыг илрүүлж сайжруулах санал гаргах', votes: 10, voters: [] },
            { id: 'p5', category: CAT_MANAGEMENT, teamInfo: 'Team Tsogtbayar', projectName: 'Мэдлэг, туршлагын сан', description: '[Meta-V:High|F:High]\nЭкспертүүдийн мэдлэг, туршлагыг дижитал хөрвүүлж, ажилтнуудын асуултад хариулах дотоод ухаалаг чатбот.\n\n- Know-how мэдээллийг ангилах\n- Сургалт хөгжлийн зөвлөмж өгөх\n- Чиглүүлэх (onboarding) материалыг санал болгох', votes: 9, voters: [] },
            { id: 'p6', category: CAT_MANAGEMENT, teamInfo: 'Team Tsogtbayar', projectName: 'Гэрээний Agent', description: '[Meta-V:High|F:Medium]\nГэрээний төсөлд автоматаар дүн шинжилгээ хийж, хууль болон стандартад нийцэж буй эсэхийг хянаж эрсдэлийг анхааруулах систем.\n\n- Гэрээний автомат хяналт\n- Эрсдэлтэй заалтыг илрүүлэх\n- Засаж сайжруулсан хувилбарыг санал болгох', votes: 8, voters: [] },
            { id: 'p7', category: CAT_MANAGEMENT, teamInfo: 'Team Tsogtbayar', projectName: 'IMS Agent', description: '[Meta-V:Medium|F:High]\nБайгууллагын нэгдсэн удирдлагын систем (ISO)-ийн хүрээнд аудит хийх, үл тохирлыг илрүүлж зөвлөмж өгөх систем.\n\n- Аудитын хуваарийн мэдэгдэл\n- Стандартын шаардлагаар чиглүүлэх\n- Залруулах арга хэмжээний төлөвлөгөө боловсруулах', votes: 8, voters: [] },
            { id: 'p8', category: CAT_MANAGEMENT, teamInfo: 'Team Tsogtbayar', projectName: 'MoM agent', description: '[Meta-V:Medium|F:High]\nХурлын яриаг бодит цагт сонсож тэмдэглэл хөтлөн, гарсан шийдвэрүүдээс Action plan автоматаар үүсгэх систем.\n\n- Яриаг хураангуйлан тэмдэглэх\n- Ажлын биелэлтийн хугацааг сануулах\n- Төслийн системд ажлуудыг бүртгэх', votes: 7, voters: [] },
            { id: 'p9', category: CAT_MANAGEMENT, teamInfo: 'Team Tsogtbayar', projectName: 'Зураг төслийн Agent', description: '[Meta-V:High|F:Low]\nИнженерийн зураг төслийн норм дүрэм, стандартын дагуу хиймэл оюунд суурилсан дизайны хувилбаруудыг санал болгох систем.\n\n- Норм дүрмийн зөрчлийн мэдэгдэл\n- Generative design хувилбарууд гаргах\n- Материалын орцын жагсаалт (BoQ) боловсруулах', votes: 6, voters: [] },
            { id: 'p10', category: CAT_OPERATIONS, teamInfo: 'Team Khurtsdulguun', projectName: 'DCD (Тархмал сүлжээг хянах)', description: '[Meta-V:High|F:Medium]\nТархмал сүлжээний бүрэлдэхүүн хэсгүүдийн өгөгдөлд анализ хийж, эвдрэл гэмтлийг урьдчилан таамаглах систем.\n\n- Хүчин чадал хэтрэх эрсдэлийн мэдэгдэл\n- Сүлжээний найдвартай байдлыг хянах\n- Засварын зардлыг бууруулах санал гаргах', votes: 5, voters: [] },
            { id: 'p11', category: CAT_OPERATIONS, teamInfo: 'Team Ganbat', projectName: 'Ухаалаг тоолуур + AI', description: '[Meta-V:High|F:High]\nУхаалаг тоолууруудаас ирж буй өгөгдөлд анализ хийж, техникийн болон арилжааны алдагдлыг илрүүлэх систем.\n\n- Хөндлөнгийн оролцооны анхааруулга\n- Алдагдлын голомтыг үнэн зөв илрүүлэх\n- Хяналт шалгалтыг оновчлох зөвлөм гаргах', votes: 5, voters: [] },
            { id: 'p12', category: CAT_OPERATIONS, teamInfo: 'Team Ganbat', projectName: 'Хэрэглэгчийн зан төлөвийн AI', description: '[Meta-V:High|F:Medium]\nХэрэглэгчдийн хэрэглээний зан төлөвт урьдчилан таамаглах анализ хийж, оновчтой тарифын багцыг санал болгох систем.\n\n- Хэрэглээний хэв маягийн өөрчлөлтийн мэдэгдэл\n- Ирээдүйн ачааллын муруй гаргах\n- Хэрэглээг оновчлох зөвлөмж өгөх', votes: 4, voters: [] },
            { id: 'p13', category: CAT_OPERATIONS, teamInfo: 'Team Ganbat', projectName: 'Цаг агаарын Forecast Agent', description: '[Meta-V:Medium|F:High]\nЦаг агаарын урьдчилсан мэдээнд үндэслэн үүсэж болзошгүй гэмтэл, саатлын байршлыг таамаглах систем.\n\n- Байгалийн гамшгийн үеийн сануулга\n- Хүний нөөц, техникийг оновчтой хуваарилах\n- Гэмтлийн байршлыг урьдчилан таамаглах', votes: 4, voters: [] },
            { id: 'p14', category: CAT_OPERATIONS, teamInfo: 'Team Gantulga', projectName: 'Work Order Үүсгэдэг Agent', description: '[Meta-V:High|F:High]\nМэдрэгчүүдийн датанд анализ хийж болзошгүй эвдрэлийг илрүүлэн, автоматаар засварын Work Request үүсгэх систем.\n\n- Эвдрэлийн таамаглал, зардлын тооцоо\n- Сэлбэг хэрэгслийн зөвлөм гаргах\n- Худалдан авалтын хүсэлт (PR) автоматаар үүсгэх', votes: 3, voters: [] },
            { id: 'p15', category: CAT_OPERATIONS, teamInfo: 'Team Gantulga', projectName: 'Тайлан хийдэг Agent', description: '[Meta-V:Medium|F:High]\nЗасвар үйлчилгээний болон зардлын чиг хандлагад анализ хийж, өдөр тутмын тайлангуудыг автоматаар бэлтгэх систем.\n\n- Зардал хэтрэлтийн анхааруулга\n- Тоноглолыг шинэчлэх эдийн засгийн үнэлгээ\n- Тайлангуудыг хүний оролцоогүй үүсгэх', votes: 3, voters: [] },
            { id: 'p16', category: CAT_OPERATIONS, teamInfo: 'Team Gantulga', projectName: 'Засварын зөвлөмж Bot', description: '[Meta-V:High|F:Medium]\nИнженерүүдэд газар дээр нь засварын зааварчилгаа, аюулгүй ажиллагааны зөвлөмжийг чат хэлбэрээр өгөх туслах.\n\n- Аюулгүй ажиллагааны эрсдэлийн сануулга\n- Засварын зааварчилгааг шуурхай хариулах\n- Гүйцэтгэлийн тайланг автоматаар үүсгэх', votes: 2, voters: [] },
            { id: 'p17', category: CAT_OPERATIONS, teamInfo: 'Team Munkhsaikhan', projectName: 'SCADA - Хяналтын Agents', description: '[Meta-V:High|F:Medium]\nSCADA системээс ирж буй бодит хугацааны өгөгдөлд дүн шинжилгээ хийж, тоноглолын элэгдэл, насжилтыг тооцоолох систем.\n\n- Онцгой SCADA event мэдэгдэл\n- Кабелийн гэмтлийг эрт илрүүлэх\n- Тоноглолыг солих хугацааг тооцоолох', votes: 2, voters: [] },
            { id: 'p18', category: CAT_OPERATIONS, teamInfo: 'Team Munkhsaikhan', projectName: 'Data Quality Manager', description: '[Meta-V:High|F:High]\nСистемүүдээс орж ирж буй өгөгдлийн чанарыг тогтмол шалгаж, дутуу болон стандартын бус датаг цэвэрлэх систем.\n\n- Өгөгдлийн урсгал тасалдлын мэдэгдэл\n- Алдаатай датаг автоматаар цэвэрлэх\n- Мэдээллийн чанарын хяналтын тайлан үүсгэх', votes: 1, voters: [] }
        ];

        // Текстийг задалж Value, Feasibility болон Feasibility тайлбарыг ялгах туслах функц
        const extractMeta = (descString) => {
            let v = 'Medium';
            let f = 'Medium';
            let text = descString || '';
            let feasDesc = '';
            
            // 1. Мета өгөгдөл задлах [Meta-V:High|F:Low]
            if (text.startsWith('[Meta-')) {
                const endIdx = text.indexOf(']');
                if (endIdx > -1) {
                    const metaStr = text.substring(6, endIdx); 
                    const parts = metaStr.split('|');
                    parts.forEach(p => {
                        if(p.startsWith('V:')) v = p.replace('V:', '');
                        if(p.startsWith('F:')) f = p.replace('F:', '');
                    });
                    text = text.substring(endIdx + 1).trim();
                }
            }

            // 2. Feasibility тайлбарыг салгах
            const feasDivider = '---FEAS_DESC---';
            const feasIdx = text.indexOf(feasDivider);
            if (feasIdx > -1) {
                feasDesc = text.substring(feasIdx + feasDivider.length).trim();
                text = text.substring(0, feasIdx).trim();
            }

            return { valueLevel: v, feasLevel: f, cleanDesc: text, feasDesc: feasDesc };
        };

        const App = () => {
            const [view, setView] = useState('form'); 
            const [currentSlide, setCurrentSlide] = useState(0);
            const [user, setUser] = useState(null);
            const [toastMsg, setToastMsg] = useState('');
            const [isSaving, setIsSaving] = useState(false);
            const [selectedTab, setSelectedTab] = useState('All'); 
            const [votingIdeas, setVotingIdeas] = useState(PREDEFINED_IDEAS);
            
            // Modal-ийн state
            const [selectedIdeaId, setSelectedIdeaId] = useState(null);
            const [modalFeasLevel, setModalFeasLevel] = useState('Medium');
            const [modalFeasDesc, setModalFeasDesc] = useState('');

            const selectedIdeaDetail = useMemo(() => {
                return votingIdeas.find(i => i.id === selectedIdeaId) || null;
            }, [votingIdeas, selectedIdeaId]);

            const initialIdea = {
                members: '', projectName: '', targetUser: '', category: CAT_MANAGEMENT, problem: '',
                solutionGeneral: '', solutionStep1: '', solutionStep2: '', solutionStep3: '', 
                businessValueLevel: 'High', businessValueDesc: '', feasibilityLevel: 'Medium', feasibilityDesc: ''
            };

            const [ideas, setIdeas] = useState([{ ...initialIdea }]);
            const [currentIndex, setCurrentIndex] = useState(0);
            
            const client = useMemo(() => {
                if (typeof window.supabase !== 'undefined') {
                    return window.supabase.createClient(supabaseUrl, supabaseKey);
                }
                return null;
            }, []);

            const activeIdea = useMemo(() => ideas[currentIndex] || initialIdea, [ideas, currentIndex]);

            useEffect(() => {
                let localUserId = localStorage.getItem('pitch_voter_id');
                if (!localUserId) {
                    localUserId = 'user_' + Math.random().toString(36).substr(2, 9);
                    localStorage.setItem('pitch_voter_id', localUserId);
                }
                setUser({ uid: localUserId });
            }, []);

            const fetchVotingData = async () => {
                if (!client) return;
                try {
                    const { data: dbIdeas, error } = await client.from('pitch_voting').select('*');
                    if (error) throw error;

                    const dbIdeaMap = {};
                    if (dbIdeas) {
                        dbIdeas.forEach(idea => dbIdeaMap[idea.id] = idea);
                    }

                    let combined = PREDEFINED_IDEAS.map(pIdea => {
                        return dbIdeaMap[pIdea.id] ? dbIdeaMap[pIdea.id] : pIdea;
                    });

                    if (dbIdeas) {
                        dbIdeas.forEach(idea => {
                            if (!PREDEFINED_IDEAS.find(p => p.id === idea.id)) {
                                combined.push(idea);
                            }
                        });
                    }

                    // Эрэмбэлэх: 1. Саналын тоогоор (Business value), 2. Feasibility үнэлгээгээр
                    const getFeasScore = (level) => level === 'High' ? 3 : (level === 'Medium' ? 2 : 1);
                    
                    combined.sort((a, b) => {
                        const votesA = a.votes || 0;
                        const votesB = b.votes || 0;
                        if (votesB !== votesA) return votesB - votesA;
                        
                        const feasA = getFeasScore(extractMeta(a.description).feasLevel);
                        const feasB = getFeasScore(extractMeta(b.description).feasLevel);
                        return feasB - feasA;
                    });
                    
                    setVotingIdeas(combined);
                } catch (e) {
                    console.error("Fetch error:", e);
                }
            };

            useEffect(() => {
                if (!client) return;
                fetchVotingData();
                const intervalId = setInterval(() => {
                    fetchVotingData();
                }, 5000);
                return () => clearInterval(intervalId);
            }, [client]);

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 3000);
            };

            const toggleVote = async (idea) => {
                if (!user || !client) return;
                const hasVoted = idea.voters && idea.voters.includes(user.uid);
                let newVoters = idea.voters || [];
                let newVotes = idea.votes || 0;

                if (hasVoted) {
                    newVoters = newVoters.filter(uid => uid !== user.uid);
                    newVotes = Math.max(0, newVotes - 1);
                } else {
                    newVoters = [...newVoters, user.uid];
                    newVotes = newVotes + 1;
                }

                // Optimistic UI update
                setVotingIdeas(prev => prev.map(i => i.id === idea.id ? { ...i, votes: newVotes, voters: newVoters } : i));

                const { error } = await client.from('pitch_voting').upsert({
                    id: idea.id,
                    votes: newVotes,
                    voters: newVoters,
                    projectName: idea.projectName,
                    teamInfo: idea.teamInfo,
                    description: idea.description,
                    category: idea.category
                });
                
                if (error) {
                    showToast("Санал өгөхөд алдаа гарлаа");
                    fetchVotingData(); 
                }
            };

            // Дэлгэрэнгүй цонхыг нээх
            const openIdeaDetail = (idea) => {
                const meta = extractMeta(idea.description);
                setModalFeasLevel(meta.feasLevel);
                setModalFeasDesc(meta.feasDesc);
                setSelectedIdeaId(idea.id);
            };

            // Feasibility үнэлгээ хадгалах
            const saveFeasibility = async () => {
                if (!client || !selectedIdeaDetail) return;
                
                const meta = extractMeta(selectedIdeaDetail.description);
                const newDesc = `[Meta-V:${meta.valueLevel}|F:${modalFeasLevel}]\n${meta.cleanDesc}\n\n---FEAS_DESC---\n${modalFeasDesc}`;

                // Optimistic UI update 
                setVotingIdeas(prev => prev.map(i => i.id === selectedIdeaDetail.id ? { ...i, description: newDesc } : i));

                const { error } = await client.from('pitch_voting').upsert({
                    id: selectedIdeaDetail.id,
                    votes: selectedIdeaDetail.votes || 0,
                    voters: selectedIdeaDetail.voters || [],
                    projectName: selectedIdeaDetail.projectName,
                    teamInfo: selectedIdeaDetail.teamInfo,
                    category: selectedIdeaDetail.category,
                    description: newDesc
                });

                if (error) {
                    showToast("Үнэлгээ хадгалахад алдаа гарлаа");
                    fetchVotingData();
                } else {
                    showToast("Технологийн үнэлгээ (Feasibility) шинэчлэгдлээ!");
                }
            };

            const publishToVoting = async () => {
                if (!client || !user) return showToast("Өгөгдлийн сан холбогдоогүй байна");
                if (!activeIdea.projectName || !activeIdea.members) return showToast("Төслийн нэр болон гишүүдийг оруулна уу");

                setIsSaving(true);
                const uniqueId = `workshop_${user.uid}_${currentIndex}`;

                const Slide2 = () => (
                    <div className="flex flex-col h-full px-20 py-20">
                        <h2 className="text-5xl font-black text-cyan-400 mb-12 uppercase tracking-widest border-b-4 border-cyan-500/30 pb-6 inline-block w-max">2. ШИЙДЭЛ</h2>
                        <div className="text-2xl md:text-3xl text-slate-200 font-medium leading-relaxed bg-slate-800/40 p-10 rounded-[2rem] border border-slate-700 mb-10 whitespace-pre-wrap shadow-inner">
                            {activeIdea.solutionGeneral || 'Ерөнхий шийдэл...'}
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8 flex-grow">
                            {[activeIdea.solutionStep1, activeIdea.solutionStep2, activeIdea.solutionStep3].map((step, idx) => (
                                <div key={idx} className="bg-slate-800/60 p-10 rounded-[2.5rem] border border-slate-600 relative shadow-2xl flex flex-col justify-center">
                                    <div className="text-6xl font-black text-slate-700/50 absolute top-6 right-8">0{idx+1}</div>
                                    <p className="text-xl md:text-2xl text-slate-200 mt-10 relative z-10 font-bold leading-snug">{step || '...'}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                );

                const Slide3 = () => (
                    <div className="flex flex-col h-full px-20 py-20 items-center justify-center">
                        <h2 className="text-5xl font-black text-white mb-16 uppercase tracking-widest text-center">3. Үнэлгээний матриц</h2>
                        
                        <div className="grid grid-cols-2 gap-12 flex-grow">
                            {/* Business Value */}
                            <div className="bg-slate-800/50 border border-slate-600 rounded-[3rem] p-12 flex flex-col items-center text-center shadow-2xl relative overflow-hidden">
                                <div className="absolute top-0 w-full h-2 bg-emerald-500"></div>
                                <h3 className="text-2xl font-bold text-slate-400 uppercase tracking-widest mb-10">Бизнесийн үнэ цэн</h3>
                                <div className="text-6xl font-black px-12 py-6 rounded-full border border-emerald-500 bg-emerald-900/30 text-emerald-400 shadow-[0_0_40px_rgba(16,185,129,0.3)] uppercase mb-12 tracking-wider">
                                    {activeIdea.businessValueLevel}
                                </div>
                                <div className="text-2xl text-slate-300 font-medium leading-relaxed whitespace-pre-wrap">
                                    {activeIdea.businessValueDesc || '...'}
                                </div>
                            </div>

                            {/* Feasibility */}
                            <div className="bg-slate-800/50 border border-slate-600 rounded-[3rem] p-12 flex flex-col items-center text-center shadow-2xl relative overflow-hidden">
                                <div className="absolute top-0 w-full h-2 bg-blue-500"></div>
                                <h3 className="text-2xl font-bold text-slate-400 uppercase tracking-widest mb-10">Хэрэгжих боломж</h3>
                                <div className="text-6xl font-black px-12 py-6 rounded-full border border-blue-500 bg-blue-900/30 text-blue-400 shadow-[0_0_40px_rgba(59,130,246,0.3)] uppercase mb-12 tracking-wider">
                                    {activeIdea.feasibilityLevel}
                                </div>
                                <div className="text-2xl text-slate-300 font-medium leading-relaxed whitespace-pre-wrap">
                                    {activeIdea.feasibilityDesc || '...'}
                                </div>
                            </div>
                        </div>
                    </div>
                );

                const presSlides = [<Slide0/>, <Slide1/>, <Slide2/>, <Slide3/>];

                return (
                    <div className="fixed inset-0 bg-[#0a0f1c] z-50 flex flex-col" style={{animation: 'fadeIn 0.4s ease-out'}}>
                        
                        <div className="flex-grow flex items-center justify-center relative overflow-hidden">
                            <div className="w-full h-full relative z-10 p-10 pb-32">
                                <div className="w-full h-full bg-[#0f172a] rounded-[3rem] shadow-[0_0_100px_rgba(0,0,0,0.8)] border border-slate-700/50 overflow-hidden relative">
                                     {presSlides[currentSlide]}
                                </div>
                            </div>
                            
                            {/* Background Blur Elements */}
                            <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-cyan-900/20 blur-[150px] rounded-full pointer-events-none"></div>
                            <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-indigo-900/20 blur-[150px] rounded-full pointer-events-none"></div>
                        </div>

                        {/* Navigation Actions */}
                        <div className="absolute bottom-10 left-0 right-0 flex justify-between items-center px-16 z-20">
                            
                            <button onClick={(e) => {e.stopPropagation(); setView('form');}} className="bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-8 py-4 rounded-2xl font-bold border border-slate-600 transition-colors text-sm uppercase tracking-widest flex items-center gap-3 shadow-xl">
                                <span className="text-xl">✕</span> Буцах
                            </button>

                            <div className="flex items-center gap-8 bg-slate-900/80 p-3 rounded-full border border-slate-700 backdrop-blur-md shadow-2xl">
                                <button 
                                    onClick={(e) => { e.stopPropagation(); setCurrentSlide(p => Math.max(0, p - 1)); }}
                                    className={`w-14 h-14 rounded-full flex items-center justify-center bg-slate-800 text-cyan-400 font-bold border border-slate-600 hover:bg-slate-700 transition-all ${currentSlide === 0 ? 'opacity-30 pointer-events-none' : ''}`}
                                >
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M15 19l-7-7 7-7"></path></svg>
                                </button>
                                
                                <div className="flex space-x-4 px-4">
                                    {presSlides.map((_, idx) => (
                                        <div key={idx} className={`w-3 h-3 rounded-full transition-all duration-500 ${idx === currentSlide ? 'bg-cyan-400 w-12 shadow-[0_0_15px_rgba(34,211,238,0.6)]' : 'bg-slate-600'}`}></div>
                                    ))}
                                </div>

                                <button 
                                    onClick={(e) => { e.stopPropagation(); setCurrentSlide(p => Math.min(presSlides.length - 1, p + 1)); }}
                                    className={`w-14 h-14 rounded-full flex items-center justify-center bg-slate-800 text-cyan-400 font-bold border border-slate-600 hover:bg-slate-700 transition-all ${currentSlide === presSlides.length - 1 ? 'opacity-30 pointer-events-none' : ''}`}
                                >
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M9 5l7 7-7 7"></path></svg>
                                </button>
                            </div>
                            
                            <div className="w-[150px]"></div> {/* Layout Balance spacer */}
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-slate-900 relative">
                    {renderToast()}
                    {view === 'voting' ? renderVotingView() : (view === 'form' ? renderFormView() : renderPresentationView())}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
