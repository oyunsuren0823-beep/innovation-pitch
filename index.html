        // Functions for parsing metadata and builds
        const extractMeta = (desc) => {
            let v = 'Medium', f = 'Medium', s = false, e = false, text = desc || '', fd = '';
            if (text.startsWith('[Meta-')) {
                const end = text.indexOf(']');
                if (end > -1) {
                    text.substring(6, end).split('|').forEach(p => {
                        if(p.startsWith('V:')) v = p.replace('V:', '');
                        if(p.startsWith('F:')) f = p.replace('F:', '');
                        if(p.startsWith('S:')) s = p.replace('S:', '') === 'true';
                        if(p.startsWith('E:')) e = p.replace('E:', '') === 'true';
                    });
                    text = text.substring(end + 1).trim();
                }
            }
            const div = '---FEAS_DESC---';
            const idx = text.indexOf(div);
            if (idx > -1) { 
                fd = text.substring(idx + div.length).trim(); 
                text = text.substring(0, idx).trim(); 
            }

            return { valueLevel: v, feasLevel: f, isShortlisted: s, isEvaluated: e, cleanDesc: text, feasDesc: fd };
        };

        const extractPPMeta = (desc) => {
            let imp = 'None', urg = 'None', txt = desc || '', disc = '';
            if (txt.startsWith('[PP-')) {
                const end = txt.indexOf(']');
                if (end > -1) {
                    txt.substring(4, end).split('|').forEach(p => { 
                        if(p.startsWith('Impact:')) imp = p.replace('Impact:', ''); 
                        if(p.startsWith('Urgency:')) urg = p.replace('Urgency:', ''); 
                    });
                    txt = txt.substring(end + 1).trim();
                }
            }
            const div = '---DISCUSSION---';
            const idx = txt.indexOf(div);
            if (idx > -1) { disc = txt.substring(idx + div.length).trim(); txt = txt.substring(0, idx).trim(); }
            return { impact: imp, urgency: urg, cleanText: txt, discussion: disc };
        };

        const buildPPDesc = (txt, imp, urg, disc) => `[PP-Impact:${imp}|Urgency:${urg}]\n${txt}${disc ? '\n\n---DISCUSSION---\n' + disc : ''}`;
        const getFeasScore = (lvl) => lvl === 'High' ? 3 : (lvl === 'Medium' ? 2 : 1);

        // Helper to get Matrix Quadrant info
        const getMatrixQuadrant = (impact, urgency) => {
            if (impact === 'High' && urgency === 'Urgent') return { label: 'CRITICAL', bg: 'bg-rose-500/20 text-rose-400 border-rose-500/30' };
            if (impact === 'High' && urgency === 'Not Urgent') return { label: 'STRATEGIC', bg: 'bg-orange-500/20 text-orange-400 border-orange-500/30' };
            if (impact === 'Low' && urgency === 'Urgent') return { label: 'QUICK WIN', bg: 'bg-yellow-500/20 text-yellow-400 border-yellow-500/30' };
            if (impact === 'Low' && urgency === 'Not Urgent') return { label: 'LOW PRIORITY', bg: 'bg-slate-500/20 text-slate-400 border-slate-500/30' };
            return { label: 'ҮНЭЛГЭЭГҮЙ', bg: 'bg-slate-700/50 text-slate-400 border-slate-600/50' };
        };

        // --- Prioritization Matrix Component ---
        const PrioritizationMatrix = ({ painPoints }) => {
            const critical = painPoints.filter(p => { const m = extractPPMeta(p.description); return m.impact === 'High' && m.urgency === 'Urgent'; });
            const strategic = painPoints.filter(p => { const m = extractPPMeta(p.description); return m.impact === 'High' && m.urgency === 'Not Urgent'; });
            const quickWin = painPoints.filter(p => { const m = extractPPMeta(p.description); return m.impact === 'Low' && m.urgency === 'Urgent'; });
            const lowPriority = painPoints.filter(p => { const m = extractPPMeta(p.description); return m.impact === 'Low' && m.urgency === 'Not Urgent'; });

            const renderChip = (pp, color) => (

                    <div className={`text-${color}-200/80 line-clamp-2`}>{extractPPMeta(pp.description).cleanText}</div>

            );

            return (
                <div className="bg-slate-800/40 p-6 md:p-8 rounded-3xl border border-slate-700 shadow-xl mb-10 w-full animate-[fadeIn_0.5s_ease-out]">
                    <h2 className="text-2xl font-bold text-white mb-8 uppercase tracking-wide text-center">Prioritization Matrix</h2>
                    
                    <div className="relative max-w-4xl mx-auto pl-10 pr-6 py-6 mb-4">
                        {/* Y-axis Label */}
                        <div className="absolute left-0 top-0 bottom-0 w-10 flex flex-col justify-between items-center py-10">
                            <span className="text-slate-500 text-[10px] font-black uppercase tracking-widest -rotate-90 whitespace-nowrap mb-8">High Impact</span>
                            <div className="w-0.5 h-full bg-slate-600/50 relative">
                                <div className="absolute -top-1 -left-1 w-2.5 h-2.5 bg-slate-500 rounded-full"></div>
                                <div className="absolute -bottom-1 -left-1 w-2.5 h-2.5 bg-slate-500 rounded-full"></div>
                            </div>
                            <span className="text-slate-500 text-[10px] font-black uppercase tracking-widest -rotate-90 whitespace-nowrap mt-8">Low Impact</span>
                        </div>

                        {/* 2x2 Grid */}
                        <div className="grid grid-cols-2 gap-4 h-[500px]">
                            {/* Strategic (High Impact, Not Urgent) */}
                            <div className="bg-orange-900/10 border border-orange-500/20 rounded-2xl p-4 flex flex-col hover:border-orange-500/40 transition-colors">
                                <h3 className="text-orange-400 font-bold mb-3 uppercase tracking-wider text-xs border-b border-orange-500/20 pb-2">Strategic (Урт хугацаанд)</h3>
                                <div className="flex-grow overflow-y-auto custom-scrollbar pr-2">
                                    {strategic.length === 0 ? <p className="text-orange-500/30 text-xs italic">Асуудал алга</p> : strategic.map(p => renderChip(p, 'orange'))}
                                </div>
                            </div>
                            
                            {/* Critical (High Impact, Urgent) */}
                            <div className="bg-rose-900/10 border border-rose-500/20 rounded-2xl p-4 flex flex-col hover:border-rose-500/40 transition-colors">
                                <h3 className="text-rose-400 font-bold mb-3 uppercase tracking-wider text-xs border-b border-rose-500/20 pb-2">Critical (Яаралтай)</h3>
                                <div className="flex-grow overflow-y-auto custom-scrollbar pr-2">
                                    {critical.length === 0 ? <p className="text-rose-500/30 text-xs italic">Асуудал алга</p> : critical.map(p => renderChip(p, 'rose'))}
                                </div>
                            </div>

                            {/* Low Priority (Low Impact, Not Urgent) */}
                            <div className="bg-slate-800/30 border border-slate-600/30 rounded-2xl p-4 flex flex-col hover:border-slate-500/50 transition-colors">
                                <h3 className="text-slate-400 font-bold mb-3 uppercase tracking-wider text-xs border-b border-slate-600/30 pb-2">Low Priority (Хойшлуулах)</h3>
                                <div className="flex-grow overflow-y-auto custom-scrollbar pr-2">
                                    {lowPriority.length === 0 ? <p className="text-slate-500/30 text-xs italic">Асуудал алга</p> : lowPriority.map(p => renderChip(p, 'slate'))}
                                </div>
                            </div>

                            {/* Quick Win (Low Impact, Urgent) */}
                            <div className="bg-yellow-900/10 border border-yellow-500/20 rounded-2xl p-4 flex flex-col hover:border-yellow-500/40 transition-colors">
                                <h3 className="text-yellow-400 font-bold mb-3 uppercase tracking-wider text-xs border-b border-yellow-500/20 pb-2">Quick Win (Шуурхай шийдэл)</h3>
                                <div className="flex-grow overflow-y-auto custom-scrollbar pr-2">
                                    {quickWin.length === 0 ? <p className="text-yellow-500/30 text-xs italic">Асуудал алга</p> : quickWin.map(p => renderChip(p, 'yellow'))}
                                </div>
                            </div>
                        </div>

                        {/* X-axis Label */}
                        <div className="absolute bottom-0 left-10 right-0 h-10 flex justify-between items-center px-4 translate-y-12">
                            <span className="text-slate-500 text-[10px] font-black uppercase tracking-widest">Not Urgent</span>
                            <div className="flex-grow h-0.5 bg-slate-600/50 mx-4 relative">
                                <div className="absolute -left-1 -top-1 w-2.5 h-2.5 bg-slate-500 rounded-full"></div>
                                <div className="absolute -right-1 -top-1 w-2.5 h-2.5 bg-slate-500 rounded-full"></div>
                            </div>
                            <span className="text-slate-500 text-[10px] font-black uppercase tracking-widest">Urgent</span>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('collab'); 
            const [currentSlide, setCurrentSlide] = useState(0);
            const [user, setUser] = useState(null);
            const [toastMsg, setToastMsg] = useState('');
            const [isSaving, setIsSaving] = useState(false);
            const [selectedTab, setSelectedTab] = useState('All'); 
            const [votingIdeas, setVotingIdeas] = useState(PREDEFINED_IDEAS);
            const [selectedId, setSelectedId] = useState(null);
            const [mFeas, setMFeas] = useState('Medium');
            const [mFeasDesc, setMFeasDesc] = useState('');
            
            const [cDept, setCDept] = useState('Нийт');
            const [cPain, setCPain] = useState('');
            const [cAuth, setCAuth] = useState('');
            
            const [isAddingPP, setIsAddingPP] = useState(false); // Шинэ асуудал бүртгэх формыг нээх төлөв
            const [ePPId, setEPPId] = useState(null);
            const [deleteId, setDeleteId] = useState(null); 
            
            const [ePPData, setEPPData] = useState({ author: '', text: '', impact: 'None', urgency: 'None', discussion: '' });

            const [ideas, setIdeas] = useState([{ ...initialIdea }]);
            const [currentIndex, setCurrentIndex] = useState(0);

            const client = useMemo(() => typeof window.supabase !== 'undefined' ? window.supabase.createClient(supabaseUrl, supabaseKey) : null, []);
            const activeIdea = useMemo(() => ideas[currentIndex] || initialIdea, [ideas, currentIndex]);
            const selIdea = useMemo(() => votingIdeas.find(i => i.id === selectedId) || null, [votingIdeas, selectedId]);

            useEffect(() => {
                const uid = localStorage.getItem('pitch_voter_id') || 'user_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('pitch_voter_id', uid);
                setUser({ uid });
            }, []);

            const sortArr = (arr) => [...arr].sort((a, b) => {
                const votesA = a.votes || 0, votesB = b.votes || 0;
                if (votesB !== votesA) return votesB - votesA;
                if(a.category === CAT_PAINPOINT && b.category === CAT_PAINPOINT) return 0;
                if(a.category === CAT_PAINPOINT || b.category === CAT_PAINPOINT) return 0;
                return getFeasScore(extractMeta(b.description).feasLevel) - getFeasScore(extractMeta(a.description).feasLevel);
            });

            const refreshData = async () => {
                if (!client) return;
                const { data } = await client.from('pitch_voting').select('*');
                if (data) {
                    const map = {};
                    data.forEach(d => map[d.id] = { ...d, projectName: d.projectname || d.projectName, teamInfo: d.teaminfo || d.teamInfo });
                    let res = PREDEFINED_IDEAS.map(p => map[p.id] || p);
                    data.forEach(d => { if(!PREDEFINED_IDEAS.find(p => p.id === d.id)) res.push(map[d.id]); });
                    setVotingIdeas(sortArr(res));
                }
            };

            useEffect(() => {
                if (!client) { setVotingIdeas(sortArr(PREDEFINED_IDEAS)); return; }
                refreshData();
                const int = setInterval(refreshData, 5000);
                return () => clearInterval(int);
            }, [client]);

            const showToast = (m) => { setToastMsg(m); setTimeout(() => setToastMsg(''), 3000); };
            const renderToast = () => toastMsg ? <div className="fixed top-6 right-6 bg-slate-800 border border-slate-600 text-white px-5 py-3 rounded-lg shadow-xl z-[300]" style={{animation: 'slideUp 0.3s ease-out'}}><span className="font-medium">{toastMsg}</span></div> : null;

            const downloadExcel = () => {
                const headers = ['Ангилал', 'Төслийн нэр', 'Баг', 'Нийт Санал', 'Бизнесийн үнэ цэн', 'Технологийн боломж (Feasibility)', 'Shortlisted', 'Асуудал & Шийдэл', 'Feasibility Тайлбар'];
                const escapeCSV = (str) => str ? `"${str.toString().replace(/"/g, '""')}"` : '""';
                const csvRows = [headers.join(',')];
                
                votingIdeas.filter(i => i.category !== CAT_PAINPOINT).forEach(idea => {
                    const meta = extractMeta(idea.description);
                    csvRows.push([
                        escapeCSV(idea.category), escapeCSV(idea.projectName), escapeCSV(idea.teamInfo), idea.votes || 0,
                        escapeCSV(meta.valueLevel), escapeCSV(meta.feasLevel), escapeCSV(meta.isShortlisted ? 'Тийм' : 'Үгүй'),
                        escapeCSV(meta.cleanDesc), escapeCSV(meta.feasDesc)
                    ].join(','));
                });
                const blob = new Blob(['\uFEFF' + csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.setAttribute('href', URL.createObjectURL(blob));
                link.setAttribute('download', 'Idea_Workshop_Export.csv');
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            };

            const onVote = async (idea) => {
                const uid = user?.uid || 'local';
                const voted = idea.voters?.includes(uid);
                let vts = idea.votes || 0, vtrs = idea.voters || [];
                if(voted) { vtrs = vtrs.filter(i => i !== uid); vts = Math.max(0, vts - 1); }
                else { vtrs = [...vtrs, uid]; vts++; }
                setVotingIdeas(p => sortArr(p.map(i => i.id === idea.id ? { ...i, votes: vts, voters: vtrs } : i)));
                if(client) await client.from('pitch_voting').upsert({ id: idea.id, votes: vts, voters: vtrs, projectname: idea.projectName || idea.projectname || 'Pain Point', teaminfo: idea.teamInfo || idea.teaminfo, description: idea.description, category: idea.category });
            };

            const onSaveFeas = async () => {
                if(!selIdea) return;
                const m = extractMeta(selIdea.description);
                // Хадгалах үед E:true болж түгжигдэнэ
                const d = `[Meta-V:${m.valueLevel}|F:${mFeas}|S:${m.isShortlisted}|E:true]\n${m.cleanDesc}${mFeasDesc ? '\n\n---FEAS_DESC---\n' + mFeasDesc : ''}`;
                setVotingIdeas(p => sortArr(p.map(i => i.id === selIdea.id ? { ...i, description: d } : i)));
                if(client) await client.from('pitch_voting').upsert({ id: selIdea.id, votes: selIdea.votes, voters: selIdea.voters, projectname: selIdea.projectName, teaminfo: selIdea.teamInfo, category: selIdea.category, description: d });
                showToast("Технологийн үнэлгээ амжилттай хадгалагдаж түгжигдлээ!");
                setSelectedId(null); 
            };

            const toggleShortlist = async (idea) => {
                const m = extractMeta(idea.description);
                const isS = !m.isShortlisted;
                const d = `[Meta-V:${m.valueLevel}|F:${m.feasLevel}|S:${isS}|E:${m.isEvaluated}]\n${m.cleanDesc}${m.feasDesc ? '\n\n---FEAS_DESC---\n' + m.feasDesc : ''}`;
                setVotingIdeas(p => sortArr(p.map(i => i.id === idea.id ? { ...i, description: d } : i)));
                if(client) await client.from('pitch_voting').upsert({ id: idea.id, votes: idea.votes, voters: idea.voters, projectname: idea.projectName, teaminfo: idea.teamInfo, category: idea.category, description: d });
                showToast(isS ? "⭐ Shortlist-д нэмэгдлээ!" : "Shortlist-ээс хасагдлаа");
            };

            const publishToVoting = async () => {
                if (!activeIdea.projectName || !activeIdea.members) return showToast("Төслийн нэр болон гишүүдийг оруулна уу");
                setIsSaving(true);
                const id = `workshop_${user?.uid || 'local'}_${currentIndex}_${Date.now()}`;
                const cl = `${activeIdea.problem}\n\n${activeIdea.solutionGeneral}\n- ${activeIdea.solutionStep1}\n- ${activeIdea.solutionStep2}\n- ${activeIdea.solutionStep3}`;
                const d = `[Meta-V:${activeIdea.businessValueLevel}|F:${activeIdea.feasibilityLevel}|S:false|E:false]\n${cl}${activeIdea.feasibilityDesc ? '\n\n---FEAS_DESC---\n' + activeIdea.feasibilityDesc : ''}`;
                const obj = { id, teaminfo: activeIdea.members, projectname: activeIdea.projectName, description: d, category: activeIdea.category, votes: 0, voters: [] };
                setVotingIdeas(prev => sortArr([...prev, obj]));
                if (client) {
                    try { await client.from('pitch_voting').upsert(obj); setView('voting'); showToast("Санал хураалтад илгээгдлээ"); } 
                    catch (e) { showToast(e.message); }
                } else { setView('voting'); showToast("Local горимд илгээгдлээ"); }
                setIsSaving(false);
            };

            const onAddPP = async () => {
                if(!cAuth || !cPain) return showToast("Бүрэн бөглөнө үү");
                if(cDept === 'Нийт') return showToast("Шинэ асуудал бүртгэхийн тулд өөрийн хэлтсийг сонгоно уу!");
                
                const id = `pp_${Date.now()}`;
                const d = buildPPDesc(cPain, 'None', 'None', '');
                const obj = { id, teaminfo: cDept, projectname: cAuth, description: d, category: CAT_PAINPOINT, votes: 1, voters: [user?.uid] };
                setVotingIdeas(p => sortArr([...p, obj]));
                setCPain('');
                setCAuth('');
                setIsAddingPP(false); // Формыг хаах
                if(client) await client.from('pitch_voting').upsert(obj);
                showToast("Асуудал амжилттай бүртгэгдлээ");
            };

            const editPP = (pp) => {
                const m = extractPPMeta(pp.description);
                setEPPId(pp.id);
                setDeleteId(null); 
                setEPPData({
                    author: pp.projectName || pp.projectname,
                    text: m.cleanText,
                    impact: m.impact,
                    urgency: m.urgency,
                    discussion: m.discussion
                });
            };

            const saveEditPP = async (pp) => {
                const d = buildPPDesc(ePPData.text, ePPData.impact, ePPData.urgency, ePPData.discussion);
                setVotingIdeas(p => p.map(i => i.id === pp.id ? { ...i, projectName: ePPData.author, projectname: ePPData.author, description: d } : i));
                setEPPId(null);
                if(client) await client.from('pitch_voting').upsert({ id: pp.id, votes: pp.votes, voters: pp.voters, projectname: ePPData.author, teaminfo: pp.teamInfo || pp.teaminfo, category: pp.category, description: d });
            };

            const confirmDelete = async (id) => {
                setVotingIdeas(p => p.filter(i => i.id !== id));
                setDeleteId(null);
                setEPPId(null);
                if(client) await client.from('pitch_voting').delete().eq('id', id);
                showToast("Асуудал устгагдлаа");
            };

            const solvePP = (pp) => {
                const m = extractPPMeta(pp.description);
                setIdeas([{ ...initialIdea, problem: m.cleanText, targetUser: pp.teamInfo || pp.teaminfo }]);
                setCurrentIndex(0);
                setView('form');
            };

            const levelClass = (lvl) => lvl === 'High' ? 'bg-blue-500/20 text-blue-400 border-blue-500/30' : lvl === 'Medium' ? 'bg-amber-500/20 text-amber-400 border-amber-500/30' : 'bg-rose-500/20 text-rose-400 border-rose-500/30';

            const getDeptCount = (dept) => {
                if (dept === 'Нийт') {
                    return votingIdeas.filter(i => i.category === CAT_PAINPOINT).length;
                }
                return votingIdeas.filter(i => i.category === CAT_PAINPOINT && (i.teamInfo === dept || i.teaminfo === dept)).length;
            };

            const renderNav = () => (
                <div className="flex justify-center mb-8">
                    <div className="bg-slate-800/60 p-1.5 rounded-2xl border border-slate-700 flex flex-wrap justify-center gap-1 w-full sm:w-auto shadow-inner">
                        <button onClick={() => setView('collab')} className={`px-5 py-2.5 rounded-xl text-sm font-medium transition-all ${view === 'collab' ? 'bg-fuchsia-500/20 text-fuchsia-400 shadow-md' : 'text-slate-400 hover:text-slate-200'}`}>CWM (Pain points)</button>
                        <button onClick={() => setView('matrix')} className={`px-5 py-2.5 rounded-xl text-sm font-medium transition-all ${view === 'matrix' ? 'bg-orange-500/20 text-orange-400 shadow-md' : 'text-slate-400 hover:text-slate-200'}`}>Матриц</button>
                        <button onClick={() => setView('form')} className={`px-5 py-2.5 rounded-xl text-sm font-medium transition-all ${view === 'form' ? 'bg-cyan-500/20 text-cyan-400 shadow-md' : 'text-slate-400 hover:text-slate-200'}`}>Санал боловсруулах</button>
                        <button onClick={() => setView('voting')} className={`px-5 py-2.5 rounded-xl text-sm font-medium transition-all ${view === 'voting' ? 'bg-emerald-500/20 text-emerald-400 shadow-md' : 'text-slate-400 hover:text-slate-200'}`}>Бидний үнэ цэнтэй IDEAS</button>
                        <div className="hidden sm:block w-px h-8 bg-slate-600 self-center mx-2"></div>
                        <button onClick={downloadExcel} className={`px-4 py-2.5 rounded-xl text-sm font-medium transition-all bg-green-500/10 text-green-400 border border-green-500/30 hover:bg-green-500/30 flex items-center justify-center gap-2`} title="Татах">
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg> Татах
                        </button>
                    </div>
                </div>
            );

            const renderMatrixView = () => {
                const list = votingIdeas.filter(i => i.category === CAT_PAINPOINT && (cDept === 'Нийт' || i.teamInfo === cDept || i.teaminfo === cDept));
                return (
                    <div className="max-w-7xl mx-auto p-4 md:p-6 bg-slate-900 min-h-screen">
                        {renderNav()}

                        <div className="flex flex-col mb-8 bg-slate-800/40 p-6 rounded-2xl border border-orange-500/30 text-center shadow-lg">
                            <h1 className="text-3xl font-bold text-white mb-2 tracking-tight uppercase">Үнэлгээний Матриц</h1>
                            <p className="text-slate-400 text-sm mb-6">Бүртгэгдсэн асуудлуудыг нөлөөлөл болон яаралтай байдлаар нь ангилж харах.</p>
                            <div className="flex justify-center flex-wrap gap-2">
                                {['Нийт', ...DEPARTMENTS].map(d => (
                                    <button key={d} onClick={() => setCDept(d)} className={`px-6 py-2.5 rounded-xl text-sm font-bold border transition-colors ${cDept === d ? 'bg-orange-500 text-white border-orange-500 shadow-[0_0_15px_rgba(249,115,22,0.4)]' : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'}`}>{d} ({getDeptCount(d)})</button>
                                ))}
                            </div>
                        </div>

                        <PrioritizationMatrix painPoints={list} />
                    </div>
                );
            };

            const renderCollaborationView = () => {
                const list = votingIdeas.filter(i => i.category === CAT_PAINPOINT && (cDept === 'Нийт' || i.teamInfo === cDept || i.teaminfo === cDept));
                return (
                    <div className="max-w-7xl mx-auto p-4 md:p-6 bg-slate-900 min-h-screen">
                        {renderNav()}

                        <div className="flex flex-col mb-8 bg-slate-800/40 p-6 rounded-2xl border border-fuchsia-500/30 text-center shadow-lg">
                            <h1 className="text-3xl font-bold text-white mb-2 tracking-tight uppercase">CWM</h1>
                            <p className="text-slate-400 text-sm mb-6">Багаараа асуудал бүрийг ангилах, үнэлэх, хэлэлцэх.</p>
                            <div className="flex justify-center flex-wrap gap-2">
                                {['Нийт', ...DEPARTMENTS].map(d => (
                                    <button key={d} onClick={() => {setCDept(d); setEPPId(null); setDeleteId(null); setIsAddingPP(false);}} className={`px-6 py-2.5 rounded-xl text-sm font-bold border transition-colors ${cDept === d ? 'bg-fuchsia-500 text-white border-fuchsia-500 shadow-[0_0_15px_rgba(217,70,239,0.4)]' : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'}`}>{d} ({getDeptCount(d)})</button>
                                ))}
                            </div>
                        </div>

                        <div className="flex flex-col gap-6">
                            
                            {/* Шинэ асуудал бүртгэх хэсэг - Дээд талд */}
                            {cDept === 'Нийт' ? (
                                <div className="text-sm font-medium text-slate-400 text-center py-6 bg-slate-800/30 rounded-2xl border border-slate-700/50 mb-2">
                                    Шинэ асуудал бүртгэхийн тулд дээрээс өөрийн хэлтсийг сонгоно уу.
                                </div>
                            ) : (
                                <div className="mb-2">
                                    {!isAddingPP ? (
                                        <button onClick={() => setIsAddingPP(true)} className="px-6 py-3 rounded-2xl text-sm font-bold bg-slate-800/60 text-fuchsia-400 border border-slate-700 hover:border-fuchsia-500/50 transition-all flex items-center gap-2 shadow-md">
                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>
                                            Шинэ асуудал бүртгэх
                                        </button>
                                    ) : (
                                        <div className="bg-slate-800/50 p-6 md:p-8 rounded-3xl border border-slate-700 shadow-inner animate-[fadeIn_0.2s_ease-out]">
                                            <div className="flex justify-between items-center mb-6 border-b border-slate-700 pb-3">
                                                <h3 className="text-xl font-bold text-fuchsia-400">Шинэ асуудал бүртгэх</h3>
                                                <button onClick={() => setIsAddingPP(false)} className="text-slate-500 hover:text-white transition-colors text-2xl leading-none">&times;</button>
                                            </div>
                                            <div className="flex flex-col gap-4">
                                                <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                                                    <div className="md:col-span-1">
                                                        <label className="text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-1.5 block">Таны нэр</label>
                                                        <input value={cAuth} onChange={e => setCAuth(e.target.value)} className="w-full p-4 bg-slate-900/50 border border-slate-600 rounded-xl text-sm text-slate-200 outline-none focus:border-fuchsia-500 transition-colors" placeholder="Овог нэр..." />
                                                    </div>
                                                    <div className="md:col-span-2">
                                                        <label className="text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-1.5 block">Асуудал</label>
                                                        <textarea value={cPain} onChange={e => setCPain(e.target.value)} className="w-full p-4 bg-slate-900/50 border border-slate-600 rounded-xl text-sm text-slate-200 outline-none resize-y focus:border-fuchsia-500 transition-colors" placeholder="Ямар асуудал тулгарч байна вэ?..." rows="2" />
                                                    </div>
                                                </div>
                                                <div className="flex justify-end mt-2">
                                                    <button onClick={onAddPP} className="px-8 py-3.5 bg-fuchsia-600 hover:bg-fuchsia-500 text-white rounded-xl text-sm font-bold shadow-lg transition-all">Бүртгэх</button>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                            
                            {/* Асуудлын жагсаалт - Grid Layout */}
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                                {list.length === 0 ? (
                                    <div className="col-span-full text-center text-slate-500 py-16 bg-slate-800/30 rounded-3xl border border-slate-700/50">
                                        Асуудал бүртгэгдээгүй байна.
                                    </div>
                                ) : list.map((pp) => {
                                const m = extractPPMeta(pp.description), isEd = ePPId === pp.id;
                                const quadrant = getMatrixQuadrant(m.impact, m.urgency);
                                return (
                                    <div key={pp.id} className={`bg-slate-800/50 p-5 md:p-6 rounded-3xl border ${isEd ? 'border-fuchsia-500/50 shadow-[0_0_15px_rgba(217,70,239,0.15)]' : 'border-slate-700 hover:border-slate-500'} shadow-lg flex flex-col gap-3 relative transition-all`}>
                                        
                                        <div className="flex justify-between items-start border-b border-slate-700/50 pb-3">
                                            <div className="flex flex-col gap-2">
                                                <span className="text-sm font-bold text-slate-300">{pp.projectName || pp.projectname}</span>
                                                <div className="flex flex-wrap gap-1.5 items-center">
                                                    {cDept === 'Нийт' && <span className="text-[9px] text-slate-400 font-bold uppercase bg-slate-800 border border-slate-600 px-1.5 py-0.5 rounded">{pp.teamInfo || pp.teaminfo}</span>}
                                                    <span className={`text-[9px] px-2 py-0.5 rounded border font-bold uppercase tracking-wider ${quadrant.bg}`}>{quadrant.label}</span>
                                                </div>
                                            </div>

                const Slide0 = () => (<div className="flex flex-col items-center justify-center h-full text-center px-10"><h1 className="text-5xl md:text-7xl font-black text-white mb-8 tracking-tighter uppercase leading-tight">{activeIdea.projectName || 'Төслийн нэр'}</h1><p className="text-2xl text-cyan-400 mb-16 font-semibold tracking-[0.2em] uppercase">Эцсийн хэрэглэгч (End user): {activeIdea.targetUser}</p><div className="bg-slate-800/80 px-10 py-5 rounded-full border border-slate-600 flex items-center gap-6 shadow-2xl backdrop-blur-md"><span className="text-sm text-slate-400 uppercase font-bold tracking-[0.3em]">Баг</span><span className="text-2xl md:text-3xl text-white font-black">{activeIdea.members || '...'}</span></div></div>);
                const Slide1 = () => (<div className="flex flex-col h-full px-12 py-10 md:px-20 md:py-16"><h2 className="text-3xl md:text-4xl font-black text-rose-400 mb-8 uppercase tracking-widest border-b-4 border-rose-500/30 pb-4 inline-block w-max">1. АСУУДАЛ</h2><div className="text-xl md:text-2xl text-slate-200 font-medium leading-normal bg-slate-800/40 p-8 md:p-12 rounded-[2.5rem] border border-slate-700 flex-grow whitespace-pre-wrap shadow-inner overflow-y-auto custom-scrollbar">{activeIdea.problem || '...'}</div></div>);
                const Slide2 = () => (<div className="flex flex-col h-full px-12 py-10 md:px-20 md:py-16"><h2 className="text-3xl md:text-4xl font-black text-cyan-400 mb-8 uppercase tracking-widest border-b-4 border-cyan-500/30 pb-4 inline-block w-max">2. ШИЙДЭЛ</h2><div className="text-lg md:text-xl text-slate-200 font-medium leading-relaxed bg-slate-800/40 p-6 md:p-8 rounded-[2rem] border border-slate-700 mb-8 whitespace-pre-wrap shadow-inner overflow-y-auto custom-scrollbar">{activeIdea.solutionGeneral || 'Ерөнхий шийдэл...'}</div><div className="grid grid-cols-1 md:grid-cols-3 gap-6 flex-grow min-h-[40%]">{[activeIdea.solutionStep1, activeIdea.solutionStep2, activeIdea.solutionStep3].map((step, idx) => (<div key={idx} className="bg-slate-800/60 p-6 md:p-8 rounded-[2.5rem] border border-slate-600 relative shadow-2xl flex flex-col justify-center overflow-y-auto custom-scrollbar"><div className="text-5xl font-black text-slate-700/50 absolute top-4 right-6">0{idx+1}</div><p className="text-base md:text-lg text-slate-200 mt-8 relative z-10 font-bold leading-snug">{step || '...'}</p></div>))}</div></div>);
                const Slide3 = () => (<div className="flex flex-col h-full px-12 py-10 md:px-20 md:py-16 items-center justify-center"><h2 className="text-3xl md:text-4xl font-black text-white mb-10 uppercase tracking-widest text-center">3. Үнэлгээний матриц</h2><div className="grid grid-cols-2 gap-8 md:gap-12 flex-grow w-full"><div className="bg-slate-800/50 border border-slate-600 rounded-[3rem] p-8 md:p-12 flex flex-col items-center text-center shadow-2xl relative overflow-hidden"><div className="absolute top-0 w-full h-2 bg-emerald-500" /><h3 className="text-lg md:text-xl font-bold text-slate-400 uppercase tracking-widest mb-6">Бизнесийн үнэ цэн</h3><div className="text-3xl md:text-4xl font-black px-8 py-4 rounded-full border border-emerald-500 bg-emerald-900/30 text-emerald-400 shadow-md uppercase mb-8 tracking-wider">{activeIdea.businessValueLevel}</div><div className="text-base md:text-lg text-slate-300 font-medium leading-relaxed whitespace-pre-wrap overflow-y-auto custom-scrollbar h-full">{activeIdea.businessValueDesc || '...'}</div></div><div className="bg-slate-800/50 border border-slate-600 rounded-[3rem] p-8 md:p-12 flex flex-col items-center text-center shadow-2xl relative overflow-hidden"><div className="absolute top-0 w-full h-2 bg-blue-500" /><h3 className="text-lg md:text-xl font-bold text-slate-400 uppercase tracking-widest mb-6">Хэрэгжих боломж</h3><div className="text-3xl md:text-4xl font-black px-8 py-4 rounded-full border border-blue-500 bg-blue-900/30 text-blue-400 shadow-md uppercase mb-8 tracking-wider">{activeIdea.feasibilityLevel}</div><div className="text-base md:text-lg text-slate-300 font-medium leading-relaxed whitespace-pre-wrap overflow-y-auto custom-scrollbar h-full">{activeIdea.feasibilityDesc || '...'}</div></div></div></div>);
                const presSlides = [<Slide0/>, <Slide1/>, <Slide2/>, <Slide3/>];
                return (
                    <div className="fixed inset-0 bg-[#0a0f1c] z-50 flex flex-col" style={{animation: 'fadeIn 0.4s ease-out'}}>
                        <div className="flex-grow flex items-center justify-center relative overflow-hidden"><div className="w-full h-full relative z-10 p-4 pb-24 md:p-8 md:pb-28"><div className="w-full h-full bg-[#0f172a] rounded-[3rem] shadow-[0_0_100px_rgba(0,0,0,0.8)] border border-slate-700/50 overflow-hidden relative">{presSlides[currentSlide]}</div></div><div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-cyan-900/20 blur-[150px] rounded-full pointer-events-none" /><div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-indigo-900/20 blur-[150px] rounded-full pointer-events-none" /></div>
                        <div className="absolute bottom-6 left-0 right-0 flex justify-between items-center px-8 md:px-16 z-20"><button onClick={() => setView('form')} className="bg-slate-800 hover:bg-slate-700 text-slate-300 px-6 py-3 md:px-8 md:py-4 rounded-2xl font-bold border border-slate-600 transition-colors text-xs md:text-sm uppercase tracking-widest flex items-center gap-2 md:gap-3 shadow-xl"><span className="text-lg md:text-xl">✕</span> Буцах</button>
                            <div className="flex items-center gap-4 md:gap-8 bg-slate-900/80 p-2 md:p-3 rounded-full border border-slate-700 backdrop-blur-md shadow-2xl"><button onClick={() => setCurrentSlide(p => Math.max(0, p - 1))} className={`w-10 h-10 md:w-14 md:h-14 rounded-full flex items-center justify-center bg-slate-800 text-cyan-400 font-bold border border-slate-600 hover:bg-slate-700 transition-all ${currentSlide === 0 ? 'opacity-30 pointer-events-none' : ''}`}><svg className="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M15 19l-7-7 7-7"></path></svg></button>
                                <div className="flex space-x-2 md:space-x-4 px-2 md:px-4">{presSlides.map((_, i) => (<div key={i} className={`w-2 h-2 md:w-3 md:h-3 rounded-full transition-all duration-500 ${i === currentSlide ? 'bg-cyan-400 w-8 md:w-12 shadow-[0_0_15px_rgba(34,211,238,0.6)]' : 'bg-slate-600'}`} />))}</div>
                                <button onClick={() => setCurrentSlide(p => Math.min(presSlides.length - 1, p + 1))} className={`w-10 h-10 md:w-14 md:h-14 rounded-full flex items-center justify-center bg-slate-800 text-cyan-400 font-bold border border-slate-600 hover:bg-slate-700 transition-all ${currentSlide === presSlides.length - 1 ? 'opacity-30 pointer-events-none' : ''}`}><svg className="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M9 5l7 7-7 7"></path></svg></button>
                            </div><div className="w-[100px] md:w-[150px]" />
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-[#0f172a]">
                    {renderToast()}
                    {view === 'collab' && renderCollaborationView()}
                    {view === 'matrix' && renderMatrixView()}
                    {view === 'form' && renderFormView()}
                    {view === 'voting' && renderVotingView()}
                    {view === 'presentation' && renderPresentationView()}

                    {selIdea && (
                        <div className="fixed inset-0 bg-black/90 z-[300] flex items-center justify-center p-4 overflow-y-auto" onClick={() => setSelectedId(null)}>
                            <div className="bg-slate-900 border border-slate-700 w-full max-w-4xl p-8 rounded-[2.5rem] shadow-2xl relative my-auto flex flex-col" onClick={e => e.stopPropagation()}>
                                <button className="absolute top-6 right-8 text-3xl text-slate-500 hover:text-white transition-colors" onClick={() => setSelectedId(null)}>&times;</button>
                                
                                <div className="mb-4 border-b border-slate-800 pb-4 pr-12">
                                    <div className="text-xs font-bold text-cyan-400 uppercase tracking-widest mb-2">{selIdea.teamInfo || selIdea.teaminfo}</div>
                                    <h2 className="text-2xl md:text-3xl font-black text-white mb-4">{selIdea.projectName || selIdea.projectname}</h2>
                                    <div className="flex flex-wrap gap-3">
                                        <button onClick={() => toggleShortlist(selIdea)} className={`text-[10px] md:text-xs px-4 py-1.5 rounded-lg font-bold uppercase transition-all flex items-center gap-1.5 shadow-md ${extractMeta(selIdea.description).isShortlisted ? 'bg-amber-500 text-slate-900 hover:bg-amber-400' : 'bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700'}`}>{extractMeta(selIdea.description).isShortlisted ? '⭐ Shortlisted (Хасах)' : '☆ Shortlist-д нэмэх'}</button>
                                    </div>
                                </div>
                                
                                <div className="text-slate-300 whitespace-pre-wrap text-sm leading-relaxed mb-6 max-h-[40vh] overflow-y-auto custom-scrollbar pr-4 bg-slate-800/40 p-6 rounded-2xl border border-slate-700/50 shadow-inner">
                                    {extractMeta(selIdea.description).cleanDesc}
                                </div>
                                
                                <div className="bg-slate-800/60 p-6 rounded-3xl border border-slate-700 flex flex-col w-full">
                                    <div className="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
                                        <h3 className="text-lg font-bold text-blue-400 flex items-center gap-2"><span>⚙️</span> Технологийн хэрэгжих боломж</h3>
                                        {extractMeta(selIdea.description).isEvaluated && (
                                            <span className="text-[10px] font-bold bg-slate-700 text-slate-300 px-2 py-1 rounded flex items-center gap-1">
                                                <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                                                Үнэлэгдсэн
                                            </span>
                                        )}
                                    </div>
                                    <div className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Боломж (Feasibility)</div>
                                    <div className="flex gap-2 mb-4">
                                        {['High', 'Medium', 'Low'].map(lvl => (
                                            <button 
                                                key={lvl} 
                                                onClick={() => !extractMeta(selIdea.description).isEvaluated && setMFeas(lvl)} 
                                                disabled={extractMeta(selIdea.description).isEvaluated}
                                                className={`px-4 py-2 rounded-xl text-xs font-bold border transition-all ${mFeas === lvl ? levelClass(lvl) : 'bg-slate-900/80 text-slate-500 border-slate-700'} ${extractMeta(selIdea.description).isEvaluated ? 'cursor-not-allowed opacity-80' : 'hover:bg-slate-700'}`}
                                            >
                                                {lvl}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Тайлбар (Tech Team)</div>
                                    <textarea 
                                        value={mFeasDesc} 
                                        onChange={e => !extractMeta(selIdea.description).isEvaluated && setMFeasDesc(e.target.value)} 
                                        disabled={extractMeta(selIdea.description).isEvaluated}
                                        className={`w-full p-4 bg-slate-900/80 border border-slate-700 rounded-xl outline-none focus:border-blue-500 text-sm text-slate-200 resize-none mb-4 flex-grow shadow-inner ${extractMeta(selIdea.description).isEvaluated ? 'cursor-not-allowed opacity-80' : ''}`} 
                                        placeholder="Технологийн багийн дүгнэлт, саналууд энд бичигдэнэ..." rows="3" 
                                    />
                                    
                                    {extractMeta(selIdea.description).isEvaluated ? (
                                        <div className="w-full py-3 bg-slate-700/50 border border-slate-600 text-slate-400 rounded-xl text-sm font-bold flex justify-center items-center gap-2">
                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                                            Үнэлгээ түгжигдсэн
                                        </div>
                                    ) : (
                                        <button onClick={onSaveFeas} className="w-full py-3 bg-blue-600 text-white rounded-xl text-sm font-bold shadow-lg hover:bg-blue-500 transition-colors">
                                            Үнэлгээ хадгалах
                                        </button>
                                    )}
                                </div>

                                <div className="pt-6 flex justify-between items-center border-t border-slate-800 mt-4">
                                    <div className="text-3xl font-black text-white flex flex-col"><span className="text-[10px] font-bold text-emerald-400 uppercase tracking-widest mb-1">Нийт санал</span>{selIdea.votes || 0}</div>
                                    <button onClick={() => onVote(selIdea)} className={`px-10 py-4 rounded-xl text-sm font-bold shadow-lg transition-all ${selIdea.voters?.includes(user?.uid) ? 'bg-emerald-500 text-slate-900' : 'bg-cyan-600 text-white hover:bg-cyan-500'}`}>{selIdea.voters?.includes(user?.uid) ? '✓ Санал өгсөн' : 'Санал өгөх'}</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
